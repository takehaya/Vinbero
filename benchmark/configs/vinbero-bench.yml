internal:
  devices:
    - enp138s0f0
    - enp138s0f1np1
  bpf:
    device_mode: "driver"
    verifier_log_level: 0
    verifier_log_size: 1073741823
  server:
    bind: "127.0.0.1:8082"
  logger:
    level: info
    format: text
    no_color: true
    add_caller: false

settings:
  # Keep stats off for measurement runs; the smoke phase flips this to
  # true via configs/vinbero-bench-stats.yml to verify the datapath.
  enable_stats: false
  fdb_aging_seconds: 0
  entries:
    sid_function:
      capacity: 1024
    headendv4:
      capacity: 1024
    headendv6:
      capacity: 1024
    headend_l2:
      capacity: 1024
    fdb:
      capacity: 8192
    bd_peer:
      capacity: 1024
    sr_policy:
      capacity: 1024
