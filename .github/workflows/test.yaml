---
name: Test

on:
  push:
    paths:
      - 'go.*'
      - '**.go'
      - '**.h'
      - '**.c'
      - 'examples/**'
      - 'sdk/**'
      - 'src/**'
      - 'pkg/**'
      - 'cmd/**'
      - '.github/workflows/test.yaml'
  pull_request:
    paths:
      - 'go.*'
      - '**.go'
      - '**.h'
      - '**.c'
      - 'examples/**'
      - 'sdk/**'
      - 'src/**'
      - 'pkg/**'
      - 'cmd/**'
      - '.github/workflows/test.yaml'

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ./go.mod
          cache: true

      - name: Cache Go build tools
        uses: actions/cache@v4
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-go-tools-${{ hashFiles('go.sum', 'scripts/install_build_tools.sh') }}
          restore-keys: |
            ${{ runner.os }}-go-tools-

      - name: Install build tools
        run: make install-build-tools

      - name: Build Vinbero
        run: make build

      - name: Test pass init() phase of all packages
        run: make test-runnable

      - name: Upload Vinbero binaries
        uses: actions/upload-artifact@v4
        with:
          name: vinbero-binary
          path: out/bin/
          retention-days: 1

  unit-test:
    name: Unit Test
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ./go.mod
          cache: true

      # The netresource netns tests create kernel VRF devices. Some runner
      # kernels already include VRF; others need linux-modules-extra.
      - name: Load kernel modules
        run: |
          if ! sudo modprobe vrf; then
            sudo apt-get update -qq
            sudo apt-get install -qq -y --no-install-recommends "linux-modules-extra-$(uname -r)"
            sudo modprobe vrf
          fi

      - name: Build and test shared control-plane controllers
        run: |
          make cplane-example cplane-bgp-observer cplane-route-composition cplane-route-composition-observer cplane-evpn-imet cplane-custom-cdplane-behavior
          VINBERO_CPLANE_PARITY=1 go test -race -timeout 35m ./sdk/go/cplane/customcontroller ./sdk/go/cplane/cdplanecontroller ./sdk/go/cplane/bgpobserver ./sdk/go/cplane/mupcontroller ./sdk/go/cplane/evpncontroller ./pkg/cplane/native

      - name: Build the dedicated Cplane/Dplane packet fixture
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang-18 libbpf-dev libelf-dev
          make -C sdk/examples/plugin-custom-cdplane-behavior BPF_CLANG=clang-18
          VINBERO_CPLANE_PARITY=1 go test -race -run '^TestCDplaneMalformedConfigPreservesRunningInstance$' ./pkg/cplane

      - name: Test EVPN controller with anonymous owned BPF maps
        run: go test -exec "sudo env VINBERO_CPLANE_PARITY=1 VINBERO_CPLANE_EVPN_BPF=1" -race -timeout 35m -run '^TestEVPNControllerOwnedBPFMaps$' ./pkg/cplane

      - name: Test EVPN controller packet and interface lifecycle
        run: |
          go test -exec "sudo env VINBERO_CPLANE_EVPN_PACKET=1 VINBERO_CPLANE_EVPN_WIRE=1 VINBERO_CPLANE_EVPN_WASM=$PWD/out/cplane-evpn-imet.wasm" \
            -v -race -count 1 -timeout 35m \
            -run '^TestEVPNController(Packet|Wire)Lifecycle$' ./pkg/cplane

      - name: Run unit tests
        # pkg/bpf reloads the BPF collection per test and keeps outgrowing
        # go test's per-package timeout under -race (the run takes ~15m on a
        # fast local machine and crossed 20m on the runner once the EVPN
        # aliasing tests landed); give it real headroom.
        run: go test -exec "sudo -E" -race -covermode=atomic -coverprofile=coverage.out -v -timeout 35m ./...

  sdk-archive-verify:
    name: SDK Archive Verify
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ./go.mod
          cache: true

      - name: Install clang + libbpf headers for sample plugin builds
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang libelf-dev libbpf-dev

      - name: Build SDK tarball and verify it produces a working plugin
        run: make sdk-archive-verify

      - name: Confirm validator rejects intentionally-bad sample plugins
        run: make sdk-test-negative

  cplane-plugin-artifacts:
    name: Control-plane Plugin Artifacts
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ./go.mod
          cache: true

      # The wasm test fixtures and the SDK example are committed build
      # artifacts: the tests and the interop lab run exactly those bytes.
      # A committed artifact that no longer matches its source is the kind
      # of drift nobody notices until a test passes for the wrong reason,
      # so both are rebuilt here and the tree must come back clean.
      - name: Install wabt (wat2wasm)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends wabt

      - name: Install TinyGo for optional compiler compatibility tests
        run: |
          curl -sSLo /tmp/tinygo.deb \
            https://github.com/tinygo-org/tinygo/releases/download/v0.43.0/tinygo_0.43.0_amd64.deb
          sudo dpkg -i /tmp/tinygo.deb

      - name: Rebuild the wasm test fixtures
        run: make cplane-wasm-testdata

      - name: Rebuild the control-plane plugin example
        run: make cplane-example

      - name: Fail if a committed artifact drifted from its source
        run: |
          if ! git diff --quiet -- pkg/cplane/testdata pkg/cplane/wasm/testdata \
              sdk/examples/cplane-custom-behavior; then
            echo "A committed wasm artifact does not match its source. Rebuild and commit:" >&2
            echo "  make cplane-wasm-testdata cplane-example" >&2
            git diff --stat -- pkg/cplane/testdata pkg/cplane/wasm/testdata \
              sdk/examples/cplane-custom-behavior >&2
            exit 1
          fi

      - name: Run the plugin runtime and harness tests against the rebuilt artifacts
        run: |
          make cplane-bgp-observer cplane-route-composition cplane-route-composition-observer cplane-evpn-imet cplane-custom-cdplane-behavior
          VINBERO_CPLANE_PARITY=1 go test -timeout 35m ./pkg/cplane/... ./sdk/go/cplane/... ./sdk/go/cplaneharness/

  integration-test:
    name: Integration Test - ${{ matrix.example }}
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        example:
          - end
          - end-x
          - end-t
          - end-dx4
          - end-dx6
          - end-dt4
          - end-dt6
          - end-dt2
          - end-dt2-p2mp
          - end-dt2m-multihomed
          - end-dx2v
          - end-as
          - end-ad
          - end-am
          - end-an
          - end-un
          - end-ua
          - end-un-usd
          - end-ut
          - end-udt4
          - end-replace
          - end-t-replace
          - end-lbs
          - headend-v4
          - headend-v6
          - headend-l2
          - headend-ecmp
          - gtp4-encap
          - gtp6-encap
          - gtp6-drop-in
          - custom-cdplane-behavior
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Download Vinbero binary
        uses: actions/download-artifact@v4
        with:
          name: vinbero-binary
          path: out/bin/

      - name: Make binaries executable
        run: chmod +x out/bin/*

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            iproute2 \
            iputils-ping \
            ethtool \
            curl \
            jq \
            python3-scapy
          if ! sudo modprobe vrf || ! sudo modprobe 8021q; then
            sudo apt-get install -y "linux-modules-extra-$(uname -r)"
          fi
          sudo modprobe vrf
          sudo modprobe 8021q

      - name: Build the Dplane plugin for the combined plugin example
        if: matrix.example == 'custom-cdplane-behavior'
        run: |
          sudo apt-get install -y --no-install-recommends clang-18 libbpf-dev libelf-dev bpftool
          make -C sdk/examples/plugin-custom-cdplane-behavior BPF_CLANG=clang-18
          make cplane-custom-cdplane-behavior

      - name: Setup test environment
        working-directory: examples/${{ matrix.example }}
        run: sudo ./setup.sh

      - name: Run tests
        working-directory: examples/${{ matrix.example }}
        run: sudo ./test.sh

      - name: Cleanup
        if: always()
        working-directory: examples/${{ matrix.example }}
        run: sudo ./teardown.sh || true

      - name: Show logs on failure
        if: failure()
        run: |
          echo "=== Vinbero logs ==="
          for f in /tmp/vinbero_*.log; do
            [ -f "$f" ] && echo "--- $f ---" && cat "$f"
          done
          echo "=== Network namespaces ==="
          ip netns list || true
          echo "=== Kernel messages ==="
          sudo dmesg | tail -50 || true
