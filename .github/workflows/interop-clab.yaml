---
# Vinbero interop containerlab labs.
#
# Deliberately separate from the netns-based example matrix: these labs
# need Docker, containerlab and privileged containers, which the
# shell/netns examples do not. They prove interop between Vinbero and an
# independent third-party implementation; the l3vpn-2site scenario peers
# Vinbero with FRR over an SRv6 L3VPN.
name: interop-clab (containerlab)

on:
  push:
    paths:
      - 'examples/interop-clab/**'
      - 'pkg/bgp/**'
      - 'pkg/prober/**'
      - 'pkg/config/config.go'
      - 'cmd/vinberod/**'
      - 'cmd/vinbero/**'
      - 'pkg/bpf/**'
      # Rebuild the SDK example for both Cplane backend jobs so shared
      # source and runtime changes exercise the current implementation.
      - 'pkg/cplane/**'
      - 'pkg/server/cplane_plugin.go'
      - 'pkg/cli/cmd_cplane_plugin.go'
      - 'sdk/c/include/**'
      - 'sdk/examples/plugin-custom-behavior/**'
      - 'Makefile'
      - 'go.mod'
      - 'go.sum'
      - 'sdk/go/cplane/**'
      - 'sdk/examples/cplane-custom-behavior/**'
      - '.github/workflows/interop-clab.yaml'
  pull_request:
    paths:
      - 'examples/interop-clab/**'
      - 'pkg/bgp/**'
      - 'pkg/prober/**'
      - 'pkg/config/config.go'
      - 'cmd/vinberod/**'
      - 'cmd/vinbero/**'
      - 'pkg/bpf/**'
      - 'pkg/cplane/**'
      - 'pkg/server/cplane_plugin.go'
      - 'pkg/cli/cmd_cplane_plugin.go'
      - 'sdk/c/include/**'
      - 'sdk/examples/plugin-custom-behavior/**'
      - 'Makefile'
      - 'go.mod'
      - 'go.sum'
      - 'sdk/go/cplane/**'
      - 'sdk/examples/cplane-custom-behavior/**'
      - '.github/workflows/interop-clab.yaml'
  workflow_dispatch:

jobs:
  interop-clab:
    name: ${{ matrix.scenario }} (${{ matrix.backend || 'default' }}) interop
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - l3vpn-2site          # SRv6 L3VPN (transposition)
          - l3vpn-2site-auto     # SRv6 L3VPN via VRF-export auto-advertise (no vbctl)
          - usid-l3vpn-2site     # SRv6 L3VPN over uSID (FRR usid-f3216, H.Encaps.Red)
          - ecmp-2site           # two FRR PEs, one prefix: ECMP spread + prober fast reroute
          - sr-policy-2site      # color-based SR Policy steering (local + multi-hop chain)
          - sr-policy-bgp-2site  # SR Policy learned over BGP (SAFI 73)
          - evpn-2site           # EVPN RT2 (MAC/IP) L2VPN over BGP (SAFI 70)
          - evpn-multihoming     # EVPN RT4 multi-homing: DF election + split-horizon
          - mup-2site            # BGP MUP (SAFI 85): controller advertises, gateway applies
          - mup-2site-multivrf   # per-VRF MUP uplink: two VPNs share one N3 endpoint + TEID
        include:
          - scenario: cplane-plugin-2site
            backend: native
          - scenario: cplane-plugin-2site
            backend: wasm
    env:
      CPLANE_BACKEND: ${{ matrix.backend || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install containerlab
        run: bash -c "$(curl -sL https://get.containerlab.dev)"

      - name: Ensure vrf kernel module
        # GitHub Actions ubuntu-latest ships an Azure-tuned kernel whose
        # base linux-image package does NOT include `vrf` -- the module
        # lives in `linux-modules-extra-<kernel>`. Try a direct load
        # first; only pay the apt cost (~25s) when the module is absent.
        # This is forward-proof against runner images that later bundle
        # the module or build it in.
        run: |
          if ! sudo modprobe vrf 2>/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq "linux-modules-extra-$(uname -r)"
            sudo modprobe vrf
          fi
          test -d /sys/module/vrf
          echo "vrf module loaded"

      - name: Install the BPF toolchain when the scenario compiles a plugin
        # A scenario that ships build.sh builds an eBPF object against the
        # SDK headers, which needs libbpf's bpf_helpers.h. The runner image
        # does not carry it, and the other scenarios do not need it, so the
        # apt cost is paid only where the hook exists.
        run: |
          if [ -f examples/interop-clab/scenarios/${{ matrix.scenario }}/build.sh ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends clang libelf-dev libbpf-dev
          fi

      - name: Set up Go for the Cplane example
        if: matrix.scenario == 'cplane-plugin-2site'
        uses: actions/setup-go@v5
        with:
          go-version-file: ./go.mod
          cache: true

      - name: Rebuild the current Cplane WASM example
        if: matrix.scenario == 'cplane-plugin-2site'
        run: make cplane-example

      - name: Build images
        working-directory: examples/interop-clab
        run: make build SCENARIO=${{ matrix.scenario }}

      - name: Deploy lab
        working-directory: examples/interop-clab
        run: make deploy SCENARIO=${{ matrix.scenario }}

      - name: Run interop test
        working-directory: examples/interop-clab
        run: make test SCENARIO=${{ matrix.scenario }}

      - name: Dump lab state on failure
        if: failure()
        working-directory: examples/interop-clab
        run: |
          diagnostics="scenarios/${{ matrix.scenario }}/diagnostics.sh"
          if [ -f "$diagnostics" ]; then
            bash "$diagnostics"
          else
            make status logs SCENARIO=${{ matrix.scenario }}
          fi

      - name: Collect Cplane state
        if: always() && matrix.scenario == 'cplane-plugin-2site'
        run: |
          mkdir -p out/interop-clab
          for site in tokyo osaka; do
            node=clab-cplane-plugin-2site-pe-$site
            docker exec "$node" cat /var/log/vinberod.log > "out/interop-clab/$site-daemon.log" 2>&1 || true
            docker exec "$node" vbctl plugin cplane stats > "out/interop-clab/$site-stats.log" 2>&1 || true
            docker exec "$node" cat /var/lib/vinbero/cplane-plugins/custom-behavior.json > "out/interop-clab/$site-manifest.json" 2>&1 || true
          done

      - name: Upload Cplane state
        if: always() && matrix.scenario == 'cplane-plugin-2site'
        uses: actions/upload-artifact@v4
        with:
          name: cplane-plugin-${{ matrix.backend }}
          path: out/interop-clab

      - name: Destroy lab
        if: always()
        working-directory: examples/interop-clab
        run: make destroy SCENARIO=${{ matrix.scenario }}
