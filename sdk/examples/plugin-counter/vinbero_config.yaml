internal:
  devices:
    - plgcnt-rt2rt1
    - plgcnt-rt2rt3
  bpf:
    device_mode: generic
  server:
    bind: "127.0.0.1:8082"
  logger:
    level: debug
    format: text
    no_color: false
    add_caller: true

settings:
  enable_stats: true
  entries:
    sid_function:
      capacity: 1024
    headendv4:
      capacity: 1024
    headendv6:
      capacity: 1024
