internal:
  devices:
    - as-rt2rt1   # SRv6 side: forward direction arrives here
    - as-rt2svc   # Service side: return direction (IFACE-IN) arrives here
  bpf:
    device_mode: generic  # Required for veth pairs
  server:
    bind: "127.0.0.1:8082"
  logger:
    level: debug
    format: text
    no_color: false
    add_caller: true

settings:
  entries:
    sid_function:
      capacity: 1024
    service_ingress:
      capacity: 1024
