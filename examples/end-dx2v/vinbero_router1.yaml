internal:
  devices:
    - dx2v-rt1h1
    - dx2v-rt1rt2
  bpf:
    device_mode: generic
  server:
    bind: "127.0.0.1:8082"
  logger:
    level: debug
    format: text
    no_color: false
    add_caller: true

settings:
  # The L2 headend circuits this daemon creates are saved here, apart
  # from the other daemons of the example.
  state_path: /tmp/vinbero_end_dx2v_router1_state.json
  entries:
    sid_function:
      capacity: 1024
    headendv4:
      capacity: 1024
    headendv6:
      capacity: 1024
