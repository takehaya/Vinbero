internal:
  devices:
    - hl2-rt3h2   # Interface towards host2 (H.Encaps.L2 for return path)
    - hl2-rt3rt2  # Interface towards router2
  bpf:
    device_mode: generic  # Required for veth pairs
  server:
    bind: "127.0.0.1:8083"
  logger:
    level: debug
    format: text
    no_color: false
    add_caller: true

settings:
  # The L2 headend circuits this daemon creates are saved here, apart
  # from the other daemons of the example.
  state_path: /tmp/vinbero_headend_l2_router3_state.json
  enable_stats: true
  entries:
    sid_function:
      capacity: 1024
    headendv4:
      capacity: 1024
    headendv6:
      capacity: 1024
    headendl2:
      capacity: 1024
