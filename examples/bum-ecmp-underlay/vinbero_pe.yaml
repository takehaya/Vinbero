internal:
  devices:
    - becmp-ac
    - becmp-ac2
    - becmp-up1
    - becmp-up2
  bpf:
    device_mode: generic
  server:
    bind: "127.0.0.1:8085"
  logger:
    level: debug
    format: text
    no_color: false
    add_caller: true

settings:
  # The L2 headend circuits this daemon creates are saved here, apart
  # from the other daemons of the example.
  state_path: /tmp/vinbero_bum_ecmp_underlay_pe_state.json
  enable_stats: true
  entries:
    sid_function:
      capacity: 1024
    headendv4:
      capacity: 1024
    headendv6:
      capacity: 1024
