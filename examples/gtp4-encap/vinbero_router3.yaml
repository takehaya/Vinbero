internal:
  devices:
    - gtp4-rt3h2   # Interface towards UPF/host2
    - gtp4-rt3rt2  # Interface towards router2
  bpf:
    device_mode: generic
  server:
    bind: "127.0.0.1:8083"
  logger:
    level: debug
    format: text
    no_color: false
    add_caller: true

settings:
  entries:
    sid_function:
      capacity: 1024
    headendv4:
      capacity: 1024
