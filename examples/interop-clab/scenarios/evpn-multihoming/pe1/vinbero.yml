internal:
  # eth1 faces the core (SRv6 underlay + iBGP); eth2 is one leg of the dual-homed
  # CE's Ethernet Segment (ES-1).
  devices:
    - eth1
    - eth2
  bpf:
    device_mode: "generic"
    verifier_log_level: 2
    verifier_log_size: 1073741823
  server:
    bind: "0.0.0.0:8080"
  logger:
    level: info
    format: text
    no_color: true
    add_caller: false

settings:
  enable_stats: false
  fdb_aging_seconds: 300
  entries:
    sid_function:
      capacity: 1024
    headendv4:
      capacity: 1024
    headendv6:
      capacity: 1024
    headend_l2:
      capacity: 1024
    fdb:
      capacity: 8192
    bd_peer:
      capacity: 1024
    sr_policy:
      capacity: 1024

# In-process BGP. pe1/pe2/pe3 are one provider AS (65100) peering iBGP
# full-mesh over their loopbacks, carrying the EVPN family (AFI 25 / SAFI 70).
# pe1 and pe2 both attach the dual-homed CE's Ethernet Segment (ES-1).
bgp:
  global:
    local_asn: 65100
    router_id: "10.255.0.1"
    listen_port: 179
    source_locator: "LOC1"
  peers:
    - neighbor: "2001:db8:ff::2"
      peer_asn: 65100
      hold_time_sec: 30
      keepalive_sec: 10
      families:
        - evpn
    - neighbor: "2001:db8:ff::3"
      peer_asn: 65100
      hold_time_sec: 30
      keepalive_sec: 10
      families:
        - evpn
  # bd 100 <-> EVPN import RT 65000:100 is bound from start.sh via
  # `vbctl vrf-bgp bind`. Keeping the binding out of YAML keeps one source of
  # truth for runtime operators.
