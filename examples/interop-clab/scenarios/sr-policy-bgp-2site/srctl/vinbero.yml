internal:
  # srctl is an SR Policy controller: it only advertises a BGP SR Policy and
  # has no forwarding role. eth1 still carries an XDP program (vinberod
  # always loads one), which harmlessly passes the BGP traffic.
  devices:
    - eth1
  bpf:
    device_mode: "generic"
    verifier_log_level: 2
    verifier_log_size: 1073741823
  server:
    bind: "0.0.0.0:8080"
  logger:
    level: info
    format: text
    no_color: true
    add_caller: false

settings:
  enable_stats: false
  fdb_aging_seconds: 300
  entries:
    sid_function:
      capacity: 1024
    headendv4:
      capacity: 1024
    headendv6:
      capacity: 1024
    headend_l2:
      capacity: 1024
    fdb:
      capacity: 8192
    bd_peer:
      capacity: 1024

# In-process BGP speaker. srctl peers with pe-tokyo over the direct eth1
# link and carries the SR Policy family (SAFI 73) only. No source_locator
# is needed: srctl advertises an SR Policy but never materialises VPN
# headend entries.
bgp:
  global:
    local_asn: 65100
    router_id: "10.255.0.3"
    listen_port: 179
  peers:
    - neighbor: "2001:db8:cc::1"
      peer_asn: 65100
      hold_time_sec: 30
      keepalive_sec: 10
      families:
        - sr_policy_ipv6
