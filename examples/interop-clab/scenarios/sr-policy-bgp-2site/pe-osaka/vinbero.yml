internal:
  # eth1 faces the core (SRv6 underlay + iBGP transport); eth2 faces
  # ce-osaka. Both carry XDP for the bidirectional L3VPN data plane.
  devices:
    - eth1
    - eth2
  bpf:
    device_mode: "generic"
  server:
    bind: "0.0.0.0:8080"
  logger:
    level: info
    format: text
    no_color: true
    add_caller: false

settings:
  enable_stats: false
  fdb_aging_seconds: 300
  entries:
    sid_function:
      capacity: 1024
    headendv4:
      capacity: 1024
    headendv6:
      capacity: 1024
    headend_l2:
      capacity: 1024
    fdb:
      capacity: 8192
    bd_peer:
      capacity: 1024

# In-process BGP speaker. The mirror of pe-tokyo: both Vinbero PEs in AS
# 65100 peer iBGP over their loopbacks, carrying VPNv4/VPNv6 and SR Policy
# (SAFI 73) on one session.
bgp:
  global:
    local_asn: 65100
    router_id: "10.255.0.2"
    listen_port: 179
    source_locator: "LOC1"
  peers:
    - neighbor: "2001:db8:ff::1"
      peer_asn: 65100
      # Tokyo initiates; a single TCP direction avoids simultaneous-open collisions.
      passive: true
      hold_time_sec: 30
      keepalive_sec: 10
      families:
        - vpnv4
        - vpnv6
        - sr_policy_ipv6
