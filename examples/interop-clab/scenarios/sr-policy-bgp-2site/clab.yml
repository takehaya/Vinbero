# containerlab topology for the sr-policy-bgp-2site interop scenario.
#
# Two Vinbero PEs that exchange SR Policies edge-to-edge over BGP (SAFI 73)
# and steer their L3VPN traffic through a shared TE waypoint:
#
#   ce-tokyo --- pe-tokyo ===== core ===== pe-osaka --- ce-osaka
#  10.1.0.0/24  (Vinbero PE)    |  |       (Vinbero PE)  10.2.0.0/24
#                            waypoint (SRv6 End, TE 経由点)
#
# Both PEs run in one provider AS (65100) and peer iBGP over their
# loopbacks, carrying VPNv4/VPNv6 (L3VPN) AND SR Policy (SAFI 73) on the
# same session. Each PE advertises a colored VPN route for its own customer
# subnet and an SR Policy for reaching itself whose transport segment is the
# waypoint's End SID. The peer receives both (origin BGP) and steers the
# colored route onto the policy, so both directions detour through the
# waypoint -- a real BGP-signaled SR-TE path, not the shortest path.
#
# `core` is a plain IPv6 router (no BGP); `waypoint` is an SRv6 End node
# (iproute2 seg6local). No FRR and no separate controller: the two edges
# drive everything themselves.
name: sr-policy-bgp-2site

topology:
  nodes:
    ce-tokyo:
      kind: linux
      image: alpine:3.20
      exec:
        - ip addr add 10.1.0.10/24 dev eth1
        - ip link set eth1 up
        - ip route replace 10.2.0.0/24 via 10.1.0.1

    pe-tokyo:
      kind: linux
      image: vinbero-interop:latest
      binds:
        - pe-tokyo/vinbero.yml:/vinbero.yml
        - pe-tokyo/start.sh:/start.sh
      exec:
        - bash /start.sh

    core:
      kind: linux
      image: alpine:3.20
      binds:
        - core/start.sh:/start.sh
      exec:
        - sh /start.sh

    waypoint:
      kind: linux
      image: alpine:3.20
      binds:
        - waypoint/start.sh:/start.sh
      exec:
        - sh /start.sh

    pe-osaka:
      kind: linux
      image: vinbero-interop:latest
      binds:
        - pe-osaka/vinbero.yml:/vinbero.yml
        - pe-osaka/start.sh:/start.sh
      exec:
        - bash /start.sh

    ce-osaka:
      kind: linux
      image: alpine:3.20
      exec:
        - ip addr add 10.2.0.10/24 dev eth1
        - ip link set eth1 up
        - ip route replace 10.1.0.0/24 via 10.2.0.1

  links:
    # CE <-> PE customer-facing ports.
    - endpoints: [ce-tokyo:eth1, pe-tokyo:eth2]
    - endpoints: [ce-osaka:eth1, pe-osaka:eth2]
    # Provider underlay: pe-tokyo <-> core <-> pe-osaka.
    - endpoints: [pe-tokyo:eth1, core:eth1]
    - endpoints: [pe-osaka:eth1, core:eth2]
    # TE waypoint hangs off the core.
    - endpoints: [core:eth3, waypoint:eth1]
