internal:
  # eth1 faces the core (SRv6 underlay; End.DT4 uplink delivery); eth2 faces the
  # DN (downlink H.Encaps onto the UE prefix). Both carry XDP.
  devices:
    - eth1
    - eth2
  bpf:
    device_mode: "generic"
  server:
    bind: "0.0.0.0:8080"
  logger:
    level: info
    format: text
    no_color: true
    add_caller: false

settings:
  enable_stats: false
  entries:
    sid_function:
      capacity: 1024
    headendv4:
      capacity: 1024
    headendv6:
      capacity: 1024

# Data-side MUP-PE (MUP Provider Edge). Passive iBGP (SAFI 85) toward the
# controller; resolves the received T1ST against mup-gw's ISD and installs the
# downlink H.Encaps. source_locator supplies the SRv6 encap source.
bgp:
  global:
    local_asn: 65100
    router_id: "10.255.0.2"
    listen_port: 179
    source_locator: "LOC1"
  # The VRF binding (import RTs + the RFC 9433 §6.6 source-embed prefix) is
  # created at runtime in start.sh via `vbctl vrf-bgp bind`, the operator
  # surface; a declarative `vrf_bindings:` block here would express the same
  # policy at boot.
  peers:
    - neighbor: "2001:db8:ff::c"   # mup-c (controller dials us)
      peer_asn: 65100
      hold_time_sec: 30
      keepalive_sec: 10
      passive: true
      families:
        - mup_ipv4
    - neighbor: "2001:db8:ff::a"   # mup-gw (it dials; exchange ISD/DSD)
      peer_asn: 65100
      hold_time_sec: 30
      keepalive_sec: 10
      passive: true
      families:
        - mup_ipv4
