internal:
  # eth1 faces the core (SRv6 underlay): the XDP data plane here runs the
  # End.DT4 *decap* of return traffic coming back from pe-osaka.
  # eth2 faces ce-tokyo: the XDP data plane there runs the H.Encaps of
  # plaintext customer traffic towards FRR's service SID. Both ports
  # carry XDP so the full bidirectional SRv6 L3VPN data plane works.
  devices:
    - eth1
    - eth2
  bpf:
    # generic mode: veth links in containerlab do not support native XDP.
    device_mode: "generic"
    verifier_log_level: 2
    verifier_log_size: 1073741823
  server:
    bind: "0.0.0.0:8080"
  logger:
    level: info
    format: text
    no_color: true
    add_caller: false

settings:
  enable_stats: false
  fdb_aging_seconds: 300
  entries:
    sid_function:
      capacity: 1024
    headendv4:
      capacity: 1024
    headendv6:
      capacity: 1024
    headend_l2:
      capacity: 1024
    fdb:
      capacity: 8192
    bd_peer:
      capacity: 1024

# In-process BGP speaker. Both PEs run Vinbero here, because the thing
# under test is a control-plane plugin and a plugin has to be present at
# both ends of the conversation: one advertises a behavior of its own,
# the other has to be the one that acts on it.
#
# The two PEs peer MP-BGP over their loopbacks, multihop past the core
# router (which is NOT in BGP). iBGP imposes no TTL=1 limit, so the
# loopback-to-loopback session crosses the core cleanly.
bgp:
  global:
    local_asn: 65100
    router_id: "10.255.0.1"
    # Bind TCP/179: vinberod owns BGP on this node, FRR connects in.
    listen_port: 179
    # Locator supplying the SRv6 encap source. Registered over RPC by
    # start.sh before the session settles.
    source_locator: "LOC1"
  peers:
    # pe-osaka's loopback. Multihop iBGP session via the IPv6 core.
    - neighbor: "2001:db8:ff::2"
      peer_asn: 65100
      hold_time_sec: 30
      keepalive_sec: 10
      families:
        - vpnv4
        - vpnv6
