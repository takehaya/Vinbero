internal:
  # eth1 faces the core (SRv6 underlay): the XDP data plane here runs the
  # End.DT4 *decap* of return traffic coming back from pe-osaka.
  # eth2 faces ce-tokyo: the XDP data plane there runs the H.Encaps of
  # plaintext customer traffic towards FRR's service SID. Both ports
  # carry XDP so the full bidirectional SRv6 L3VPN data plane works.
  devices:
    - eth1
    - eth2
  bpf:
    # generic mode: veth links in containerlab do not support native XDP.
    device_mode: "generic"
    verifier_log_level: 2
    verifier_log_size: 1073741823
  server:
    bind: "0.0.0.0:8080"
  logger:
    level: info
    format: text
    no_color: true
    add_caller: false

settings:
  enable_stats: false
  fdb_aging_seconds: 300
  entries:
    sid_function:
      capacity: 1024
    headendv4:
      capacity: 1024
    headendv6:
      capacity: 1024
    headend_l2:
      capacity: 1024
    fdb:
      capacity: 8192
    bd_peer:
      capacity: 1024

# In-process BGP speaker. Consulted because vinberod is started with
# --bgp-enabled (see start.sh). Both PEs sit in one provider AS 65100
# and run an iBGP VPNv4/VPNv6 session -- the textbook SRv6 L3VPN design
# (PEs of a single provider domain peer iBGP). pe-osaka runs FRR, the
# independent RFC 9252 implementation; pe-tokyo runs Vinbero under test.
#
# The two PEs peer MP-BGP directly over their loopbacks, multihop past
# the core router (which is NOT in BGP). iBGP imposes no TTL=1 limit, so
# the loopback-to-loopback session crosses the core cleanly. The loopback
# nexthop is reachable via the static underlay routes from start.sh.
# Liveness prober: each ECMP path member is probed with an SRv6 self-probe
# that embeds the SR Policy's transport chain (core End -> FRR End) before
# terminating at the advertising PE's loopback. Killing a waypoint End SID
# is therefore detected here even while plain PE-to-PE reachability is fine
# -- the property the test's failure-injection step asserts.
prober:
  enable: true
  interval_ms: 100
  multiplier: 3

bgp:
  global:
    local_asn: 65100
    router_id: "10.255.0.1"
    # Bind TCP/179: vinberod owns BGP on this node, FRR connects in.
    listen_port: 179
    # Locator supplying the SRv6 encap source for routes learned from
    # FRR. Registered over RPC by start.sh before the session settles
    # (the applier needs it present to materialise headend entries).
    source_locator: "LOC1"
    # The prober's probe source. It must be an address the kernel owns
    # and delivers locally (the echo reply returns as plain IPv6), so the
    # loopback is used; the locator base is registered over RPC only
    # after boot and is not a kernel-owned address anyway.
    next_hop: "2001:db8:ff::1"
  peers:
    # pe-osaka's loopback. Multihop iBGP session via the IPv6 core.
    - neighbor: "2001:db8:ff::2"
      peer_asn: 65100
      hold_time_sec: 30
      keepalive_sec: 10
      families:
        - vpnv4
        - vpnv6
