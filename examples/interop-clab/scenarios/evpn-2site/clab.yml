# containerlab topology for the evpn-2site interop scenario.
#
# Two Vinbero PEs running an SRv6 EVPN L2VPN (ELAN). Each PE advertises its
# local customer MAC as a BGP EVPN RT2 (MAC/IP, AFI 25 / SAFI 70) carrying its
# own End.DT2U service SID, and installs the peer's RT2 to forward unicast L2
# frames toward it:
#
#   ce-tokyo --- pe-tokyo ===== core ===== pe-osaka --- ce-osaka
#  10.0.0.10/24 (Vinbero PE)              (Vinbero PE)  10.0.0.20/24
#   one stretched L2 broadcast domain (bd 100) over SRv6
#
# Both CEs sit in ONE subnet (10.0.0.0/24): the EVPN bridges them at L2. Both
# PEs are in provider AS 65100 and peer iBGP over their loopbacks carrying the
# EVPN family. ce-tokyo's frame to ce-osaka is H.Encaps.L2'd toward pe-osaka's
# End.DT2U SID (learned via RT2) and decapped into pe-osaka's bridge.
#
# Scope: RT2 (unicast) only. BUM flooding (broadcast/unknown-unicast) needs
# RT3 (Inclusive Multicast), a later phase, so the CEs carry static ARP for
# each other to keep the traffic pure unicast. `core` is a plain IPv6 router.
name: evpn-2site

topology:
  nodes:
    ce-tokyo:
      kind: linux
      image: alpine:3.20
      exec:
        - ip link set eth1 address aa:bb:cc:00:00:10
        - ip addr add 10.0.0.10/24 dev eth1
        - ip link set eth1 up
        - arp -s 10.0.0.20 aa:bb:cc:00:00:20

    pe-tokyo:
      kind: linux
      image: vinbero-interop:latest
      binds:
        - pe-tokyo/vinbero.yml:/vinbero.yml
        - pe-tokyo/start.sh:/start.sh
      exec:
        - bash /start.sh

    core:
      kind: linux
      image: alpine:3.20
      binds:
        - core/start.sh:/start.sh
      exec:
        - sh /start.sh

    pe-osaka:
      kind: linux
      image: vinbero-interop:latest
      binds:
        - pe-osaka/vinbero.yml:/vinbero.yml
        - pe-osaka/start.sh:/start.sh
      exec:
        - bash /start.sh

    ce-osaka:
      kind: linux
      image: alpine:3.20
      exec:
        - ip link set eth1 address aa:bb:cc:00:00:20
        - ip addr add 10.0.0.20/24 dev eth1
        - ip link set eth1 up
        - arp -s 10.0.0.10 aa:bb:cc:00:00:10

  links:
    # CE <-> PE customer-facing ports (one stretched L2 domain).
    - endpoints: [ce-tokyo:eth1, pe-tokyo:eth2]
    - endpoints: [ce-osaka:eth1, pe-osaka:eth2]
    # Provider underlay: pe-tokyo <-> core <-> pe-osaka.
    - endpoints: [pe-tokyo:eth1, core:eth1]
    - endpoints: [pe-osaka:eth1, core:eth2]
