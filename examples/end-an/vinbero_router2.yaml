internal:
  devices:
    - an-rt2rt1   # SRv6 side: the End.AN SID processes packets here
  bpf:
    device_mode: generic  # Required for veth pairs
  server:
    bind: "127.0.0.1:8082"
  logger:
    level: debug
    format: text
    no_color: false
    add_caller: true

settings:
  entries:
    sid_function:
      capacity: 1024
