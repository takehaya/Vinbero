internal:
  devices:
    - lbs-rt2rt1  # Interface towards router1 (with "lbs-" prefix)
    - lbs-rt2rt3  # Interface towards router3 (with "lbs-" prefix)
  bpf:
    device_mode: generic  # Required for veth pairs
  server:
    bind: "127.0.0.1:8097"
  logger:
    level: debug
    format: text
    no_color: false
    add_caller: true

settings:
  entries:
    sid_function:
      capacity: 1024
    headendv4:
      capacity: 1024
    headendv6:
      capacity: 1024
