internal:
  devices:
    - hv4-rt1h1   # Interface towards host1 (with prefix)
    - hv4-rt1rt2  # Interface towards router2 (with prefix)
  bpf:
    device_mode: generic  # Required for veth pairs
  server:
    bind: "127.0.0.1:8082"
  logger:
    level: debug
    format: text
    no_color: false
    add_caller: true

settings:
  entries:
    sid_function:
      capacity: 1024
    headendv4:
      capacity: 1024
    headendv6:
      capacity: 1024
