frr version 10.2.1
frr defaults traditional
hostname frr-pe
log file /var/log/frr/frr.log
log stdout
service integrated-vtysh-config
!
! ---------------------------------------------------------------------------
! Remote PE for the FRR <-> Vinbero SRv6 L3VPN interop lab.
!
! This node is the independent RFC 9252 implementation. It:
!   - owns an SRv6 locator (fd00:200::/64) under `segment-routing srv6`,
!   - runs a VRF `vrf-cust` with a local customer prefix,
!   - exports that VRF into VPNv4/VPNv6 with an SRv6 service SID,
!   - peers with Vinbero over the eth1 IPv6 link.
!
! The config structure follows the FRR topotest
! tests/topotests/bgp_srv6l3vpn_over_ipv6 (stable/10.2): the SRv6
! locator is attached to the *default* BGP instance, and each VRF
! instance carries `sid vpn export <index>` per address-family.
! ---------------------------------------------------------------------------
!
! BGP session + locator-block underlay link to vinbero.
interface eth1
 ipv6 address 2001:db8:ff::1/64
exit
!
! Customer-facing dummy (created in start.sh, placed in vrf-cust).
interface cust0 vrf vrf-cust
 ip address 10.200.0.1/24
 ipv6 address fd00:c200::1/64
exit
!
! ---------------------------------------------------------------------------
! SRv6 locator. The per-VRF VPN service SIDs are carved from this block.
! uSID is intentionally NOT used -- classic full-length SIDs keep the
! TLV layout simple for cross-implementation decode.
! ---------------------------------------------------------------------------
segment-routing
 srv6
  locators
   locator LOC1
    prefix fd00:200::/64
   exit
  exit
 exit
exit
!
! ---------------------------------------------------------------------------
! BGP. The default instance runs the VPNv4/VPNv6 sessions and owns the
! SRv6 locator; the per-VRF instance redistributes connected routes and
! exports them with an SRv6 service SID.
! ---------------------------------------------------------------------------
router bgp 65200
 bgp router-id 10.255.0.200
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 !
 neighbor 2001:db8:ff::2 remote-as 65100
 neighbor 2001:db8:ff::2 timers 3 10
 neighbor 2001:db8:ff::2 timers connect 1
 neighbor 2001:db8:ff::2 capability extended-nexthop
 !
 segment-routing srv6
  locator LOC1
 exit
 !
 address-family ipv4 vpn
  neighbor 2001:db8:ff::2 activate
 exit-address-family
 !
 address-family ipv6 vpn
  neighbor 2001:db8:ff::2 activate
 exit-address-family
exit
!
router bgp 65200 vrf vrf-cust
 bgp router-id 10.255.0.200
 !
 address-family ipv4 unicast
  redistribute connected
  sid vpn export 1
  rd vpn export 65200:200
  rt vpn both 65000:200
  import vpn
  export vpn
 exit-address-family
 !
 address-family ipv6 unicast
  redistribute connected
  sid vpn export 2
  rd vpn export 65200:206
  rt vpn both 65000:206
  import vpn
  export vpn
 exit-address-family
exit
!
line vty
!
