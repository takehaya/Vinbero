syntax = "proto3";

package vinbero.v1;

import "vinbero/v1/enums.proto";

option go_package = "github.com/takehaya/vinbero/api/vinbero/v1;vinberov1";

// BgpRouteService advertises and withdraws BGP routes through the
// in-process BGP speaker. Phase 1e exposes operator-explicit
// advertisement: the caller supplies the full route (prefix, RD, route
// targets, SRv6 SID, next hop) rather than deriving it from existing
// SID / headend entries. Automatic advertisement of local state is a
// Phase 2 follow-up.
//
// Only meaningful when vinberod runs with --bgp-enabled.
service BgpRouteService {
  rpc BgpAdvertiseVpn(BgpAdvertiseVpnRequest) returns (BgpAdvertiseVpnResponse);
  rpc BgpAdvertiseUnicast(BgpAdvertiseUnicastRequest) returns (BgpAdvertiseUnicastResponse);
  rpc BgpWithdraw(BgpWithdrawRequest) returns (BgpWithdrawResponse);
}

// BgpVpnRoute is an L3VPN route to advertise.
message BgpVpnRoute {
  string family = 1;                // "vpnv4" or "vpnv6"
  string prefix = 2;                // CIDR, e.g. "10.0.0.0/24"
  string rd = 3;                    // route distinguisher, "65000:100"
  repeated string route_targets = 4; // "65000:100" form
  string srv6_sid = 5;              // SRv6 service SID (IPv6)
  string next_hop = 6;
}

// BgpUnicastRoute is an IPv6 unicast route to advertise.
message BgpUnicastRoute {
  string prefix = 1;
  string next_hop = 2;
}

// BgpRouteKey identifies a previously advertised route for withdrawal.
message BgpRouteKey {
  string family = 1; // "vpnv4" / "vpnv6" / "ipv6_unicast"
  string prefix = 2;
  string rd = 3;     // empty for ipv6_unicast
}

message BgpAdvertiseVpnRequest {
  repeated BgpVpnRoute routes = 1;
}
message BgpAdvertiseVpnResponse {
  repeated BgpVpnRoute advertised = 1;
  repeated OperationError errors = 2;
}

message BgpAdvertiseUnicastRequest {
  repeated BgpUnicastRoute routes = 1;
}
message BgpAdvertiseUnicastResponse {
  repeated BgpUnicastRoute advertised = 1;
  repeated OperationError errors = 2;
}

message BgpWithdrawRequest {
  repeated BgpRouteKey keys = 1;
}
message BgpWithdrawResponse {
  repeated BgpRouteKey withdrawn = 1;
  repeated OperationError errors = 2;
}
