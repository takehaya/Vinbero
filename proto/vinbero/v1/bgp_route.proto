syntax = "proto3";

package vinbero.v1;

import "vinbero/v1/enums.proto";

option go_package = "github.com/takehaya/vinbero/api/vinbero/v1;vinberov1";

// BgpRouteService advertises and withdraws BGP routes through the
// in-process BGP speaker. Phase 1e exposes operator-explicit
// advertisement: the caller supplies the full route (prefix, RD, route
// targets, SRv6 SID, next hop), or a full SR Policy (color, endpoint,
// transport segments, preference, next hop), rather than deriving it from
// existing SID / headend entries. Automatic advertisement of local state
// is a Phase 2 follow-up.
//
// Only meaningful when vinberod runs with --bgp-enabled.
service BgpRouteService {
  rpc BgpAdvertiseVpn(BgpAdvertiseVpnRequest) returns (BgpAdvertiseVpnResponse);
  rpc BgpAdvertiseUnicast(BgpAdvertiseUnicastRequest) returns (BgpAdvertiseUnicastResponse);
  rpc BgpWithdraw(BgpWithdrawRequest) returns (BgpWithdrawResponse);
  rpc BgpAdvertiseSrPolicy(BgpAdvertiseSrPolicyRequest) returns (BgpAdvertiseSrPolicyResponse);
  rpc BgpWithdrawSrPolicy(BgpWithdrawSrPolicyRequest) returns (BgpWithdrawSrPolicyResponse);
  rpc BgpAdvertiseEvpnMac(BgpAdvertiseEvpnMacRequest) returns (BgpAdvertiseEvpnMacResponse);
  rpc BgpWithdrawEvpnMac(BgpWithdrawEvpnMacRequest) returns (BgpWithdrawEvpnMacResponse);
  rpc BgpAdvertiseEvpnImet(BgpAdvertiseEvpnImetRequest) returns (BgpAdvertiseEvpnImetResponse);
  rpc BgpWithdrawEvpnImet(BgpWithdrawEvpnImetRequest) returns (BgpWithdrawEvpnImetResponse);
  rpc BgpAdvertiseEvpnEs(BgpAdvertiseEvpnEsRequest) returns (BgpAdvertiseEvpnEsResponse);
  rpc BgpWithdrawEvpnEs(BgpWithdrawEvpnEsRequest) returns (BgpWithdrawEvpnEsResponse);
  rpc BgpAdvertiseMup(BgpAdvertiseMupRequest) returns (BgpAdvertiseMupResponse);
  rpc BgpWithdrawMup(BgpWithdrawMupRequest) returns (BgpWithdrawMupResponse);
}

// BgpVpnRoute is an L3VPN route to advertise.
message BgpVpnRoute {
  string family = 1; // "vpnv4" or "vpnv6"
  string prefix = 2; // CIDR, e.g. "10.0.0.0/24"
  string rd = 3; // route distinguisher, "65000:100"
  repeated string route_targets = 4; // "65000:100" form
  string srv6_sid = 5; // SRv6 service SID (IPv6)
  string next_hop = 6;
  uint32 color = 7; // Color Extended Community (0 = none)
}

// BgpUnicastRoute is an IPv6 unicast route to advertise.
message BgpUnicastRoute {
  string prefix = 1;
  string next_hop = 2;
}

// BgpRouteKey identifies a previously advertised route for withdrawal.
message BgpRouteKey {
  string family = 1; // "vpnv4" / "vpnv6" / "ipv6_unicast"
  string prefix = 2;
  string rd = 3; // empty for ipv6_unicast
}

message BgpAdvertiseVpnRequest {
  repeated BgpVpnRoute routes = 1;
}
message BgpAdvertiseVpnResponse {
  repeated BgpVpnRoute advertised = 1;
  repeated OperationError errors = 2;
}

message BgpAdvertiseUnicastRequest {
  repeated BgpUnicastRoute routes = 1;
}
message BgpAdvertiseUnicastResponse {
  repeated BgpUnicastRoute advertised = 1;
  repeated OperationError errors = 2;
}

message BgpWithdrawRequest {
  repeated BgpRouteKey keys = 1;
}
message BgpWithdrawResponse {
  repeated BgpRouteKey withdrawn = 1;
  repeated OperationError errors = 2;
}

// BgpSrPolicy is a local SR Policy (SAFI 73) to advertise. The
// {color, endpoint, distinguisher} tuple is the NLRI key (RFC 9830); the
// segments are the transport SID list of the single candidate path.
message BgpSrPolicy {
  uint32 color = 1;
  string endpoint = 2; // IPv6 endpoint
  repeated string segments = 3; // transport SID list (IPv6)
  uint32 preference = 4; // 0 -> RFC 9256 default
  uint32 distinguisher = 5;
  string next_hop = 6; // IPv6 BGP next hop
}

// BgpSrPolicyKey identifies a previously advertised SR Policy for withdrawal.
message BgpSrPolicyKey {
  uint32 color = 1;
  string endpoint = 2;
  uint32 distinguisher = 3;
}

message BgpAdvertiseSrPolicyRequest {
  repeated BgpSrPolicy policies = 1;
}
message BgpAdvertiseSrPolicyResponse {
  repeated BgpSrPolicy advertised = 1;
  repeated OperationError errors = 2;
}

message BgpWithdrawSrPolicyRequest {
  repeated BgpSrPolicyKey keys = 1;
}
message BgpWithdrawSrPolicyResponse {
  repeated BgpSrPolicyKey withdrawn = 1;
  repeated OperationError errors = 2;
}

// BgpEvpnMac is a local EVPN RT2 (MAC/IP) to advertise. The {rd,
// ethernet_tag, mac} tuple is the NLRI key; the SID is the local End.DT2U
// service SID and route_targets are the EVI's export RTs.
message BgpEvpnMac {
  string rd = 1;
  repeated string route_targets = 2;
  string mac = 3; // "aa:bb:cc:dd:ee:ff"
  uint32 ethernet_tag = 4;
  string sid = 5; // local End.DT2U SID (IPv6)
  string next_hop = 6; // IPv6 BGP next hop
  string esi = 7; // optional, "00:00:..." 10-octet form; empty = single-homed
}

// BgpEvpnMacKey identifies a previously advertised RT2 for withdrawal.
message BgpEvpnMacKey {
  string rd = 1;
  uint32 ethernet_tag = 2;
  string mac = 3;
}

message BgpAdvertiseEvpnMacRequest {
  repeated BgpEvpnMac macs = 1;
}
message BgpAdvertiseEvpnMacResponse {
  repeated BgpEvpnMac advertised = 1;
  repeated OperationError errors = 2;
}

message BgpWithdrawEvpnMacRequest {
  repeated BgpEvpnMacKey keys = 1;
}
message BgpWithdrawEvpnMacResponse {
  repeated BgpEvpnMacKey withdrawn = 1;
  repeated OperationError errors = 2;
}

// BgpEvpnImet is a local EVPN RT3 (Inclusive Multicast) to advertise. The
// {rd, ethernet_tag} tuple is the NLRI key; the SID is the local End.DT2M
// flood service SID and route_targets are the EVI's export RTs.
message BgpEvpnImet {
  string rd = 1;
  repeated string route_targets = 2;
  uint32 ethernet_tag = 3;
  string sid = 4; // local End.DT2M SID (IPv6)
  string next_hop = 5; // IPv6 BGP next hop / originating router
}

// BgpEvpnImetKey identifies a previously advertised RT3 for withdrawal.
message BgpEvpnImetKey {
  string rd = 1;
  uint32 ethernet_tag = 2;
}

message BgpAdvertiseEvpnImetRequest {
  repeated BgpEvpnImet imets = 1;
}
message BgpAdvertiseEvpnImetResponse {
  repeated BgpEvpnImet advertised = 1;
  repeated OperationError errors = 2;
}

message BgpWithdrawEvpnImetRequest {
  repeated BgpEvpnImetKey keys = 1;
}
message BgpWithdrawEvpnImetResponse {
  repeated BgpEvpnImetKey withdrawn = 1;
  repeated OperationError errors = 2;
}

// BgpEvpnEs is a local EVPN RT4 (Ethernet Segment) to advertise. It carries no
// SRv6 SID; the ES-Import route target signals segment membership and the next
// hop is the originating PE source used in DF election.
message BgpEvpnEs {
  string rd = 1;
  string esi = 2; // 10-octet ESI, "00:11:22:..." form
  string es_import_rt = 3; // ES-Import RT as a MAC "aa:bb:cc:dd:ee:ff"
  string next_hop = 4; // IPv6 BGP next hop / originating PE source
}

// BgpEvpnEsKey identifies a previously advertised RT4 for withdrawal.
message BgpEvpnEsKey {
  string rd = 1;
  string esi = 2;
}

message BgpAdvertiseEvpnEsRequest {
  repeated BgpEvpnEs segments = 1;
}
message BgpAdvertiseEvpnEsResponse {
  repeated BgpEvpnEs advertised = 1;
  repeated OperationError errors = 2;
}

message BgpWithdrawEvpnEsRequest {
  repeated BgpEvpnEsKey keys = 1;
}
message BgpWithdrawEvpnEsResponse {
  repeated BgpEvpnEsKey withdrawn = 1;
  repeated OperationError errors = 2;
}

// BgpMupRoute is a BGP MUP route (SAFI 85, 3GPP-5G; draft-mpmz-bess-mup-safi).
// One message carries every route type; route_type selects which fields apply.
// Unlike EVPN (which uses a typed message + RPC per route type), MUP's four
// types share nearly all NLRI fields, so a single envelope + route_type
// discriminator mirrors the internal bgp.MUPRoute and avoids four near-identical
// messages; this is a deliberate divergence from the EVPN precedent.
// Direction: t1st is the per-UE downlink, t2st the aggregate uplink (TEID as a
// variable-length prefix of teid_len bits); isd/dsd advertise the interwork /
// direct segments.
message BgpMupRoute {
  string route_type = 1; // "isd" | "dsd" | "t1st" | "t2st"
  string rd = 2;
  repeated string route_targets = 3;
  string prefix = 4; // isd segment prefix / t1st UE prefix (CIDR)
  string address = 5; // dsd direct-segment endpoint address
  uint32 teid = 6; // t1st exact TEID / t2st TEID-prefix value
  uint32 teid_len = 7; // t2st significant TEID prefix bits (t1st: 32)
  uint32 qfi = 8; // t1st QoS Flow Identifier
  uint32 rqi = 9; // t1st Reflective QoS Indicator
  string endpoint = 10; // t1st gNB N3 address / t2st GTP tunnel endpoint
  string source = 11; // t1st optional source address
  uint32 segment_id2 = 12; // BGP MUP Extended Community segment id (16-bit half)
  uint32 segment_id4 = 13; // BGP MUP Extended Community segment id (32-bit half)
  string srv6_sid = 14; // segment locator:function (SRv6 Services TLV)
  string next_hop = 15;
}

message BgpAdvertiseMupRequest {
  repeated BgpMupRoute routes = 1;
}
message BgpAdvertiseMupResponse {
  repeated BgpMupRoute advertised = 1;
  repeated OperationError errors = 2;
}

message BgpWithdrawMupRequest {
  repeated BgpMupRoute routes = 1;
}
message BgpWithdrawMupResponse {
  repeated BgpMupRoute withdrawn = 1;
  repeated OperationError errors = 2;
}
