syntax = "proto3";

package vinbero.v1;

option go_package = "github.com/takehaya/vinbero/api/vinbero/v1;vinberov1";

// Srv6LocalFlavor represents SRv6 local flavor types
enum Srv6LocalFlavor {
  SRV6_LOCAL_FLAVOR_UNSPECIFIED = 0;
  SRV6_LOCAL_FLAVOR_NONE = 1;
  SRV6_LOCAL_FLAVOR_PSP = 2; // Penultimate Segment Pop
  SRV6_LOCAL_FLAVOR_USP = 3; // Ultimate Segment Pop
  SRV6_LOCAL_FLAVOR_USD = 4; // Ultimate Segment Decapsulation
}

// Srv6LocalAction represents SRv6 Endpoint action types
enum Srv6LocalAction {
  SRV6_LOCAL_ACTION_UNSPECIFIED = 0;
  SRV6_LOCAL_ACTION_END = 1; // End
  SRV6_LOCAL_ACTION_END_X = 2; // End.X
  SRV6_LOCAL_ACTION_END_T = 3; // End.T
  SRV6_LOCAL_ACTION_END_DX2 = 4; // End.DX2
  SRV6_LOCAL_ACTION_END_DX6 = 5; // End.DX6
  SRV6_LOCAL_ACTION_END_DX4 = 6; // End.DX4
  SRV6_LOCAL_ACTION_END_DT6 = 7; // End.DT6
  SRV6_LOCAL_ACTION_END_DT4 = 8; // End.DT4
  SRV6_LOCAL_ACTION_END_DT46 = 9; // End.DT46
  SRV6_LOCAL_ACTION_END_B6 = 10; // End.B6
  SRV6_LOCAL_ACTION_END_B6_ENCAPS = 11; // End.B6.Encaps
  SRV6_LOCAL_ACTION_END_BM = 12; // End.BM
  SRV6_LOCAL_ACTION_END_S = 13; // End.S
  SRV6_LOCAL_ACTION_END_AS = 14; // End.AS
  SRV6_LOCAL_ACTION_END_AM = 15; // End.AM
  SRV6_LOCAL_ACTION_END_BPF = 16; // End.BPF
  SRV6_LOCAL_ACTION_END_DT2 = 17; // End.DT2 (L2 table lookup with FDB)
  SRV6_LOCAL_ACTION_END_M_GTP6_D = 18; // End.M.GTP6.D (GTP-U/IPv6 => SRv6)
  SRV6_LOCAL_ACTION_END_M_GTP6_D_DI = 19; // End.M.GTP6.D.Di (GTP-U/IPv6 => SRv6, Drop-In)
  SRV6_LOCAL_ACTION_END_M_GTP6_E = 20; // End.M.GTP6.E (SRv6 => GTP-U/IPv6)
  SRV6_LOCAL_ACTION_END_M_GTP4_E = 21; // End.M.GTP4.E (SRv6 => GTP-U/IPv4)
  SRV6_LOCAL_ACTION_END_DX2V = 22; // End.DX2V (VLAN L2 cross-connect)
  SRV6_LOCAL_ACTION_END_DT2M = 23; // End.DT2M (L2 table flooding for BUM, RFC 8986 Sec.4.12)
  SRV6_LOCAL_ACTION_END_AD = 24; // End.AD (dynamic proxy, draft-ietf-spring-srv6-service-programming)
  SRV6_LOCAL_ACTION_END_AN = 25; // End.AN (SR-aware service, draft-ietf-spring-srv6-service-programming)
  SRV6_LOCAL_ACTION_END_UN = 26; // uN: End with NEXT-C-SID (RFC 9800 Sec.4.1.1)
  SRV6_LOCAL_ACTION_END_UA = 27; // uA: End.X with NEXT-C-SID (RFC 9800 Sec.4.1.2)
  SRV6_LOCAL_ACTION_END_UT = 28; // uT: End.T with NEXT-C-SID (RFC 9800 Sec.4.1.3)
  SRV6_LOCAL_ACTION_END_REPLACE = 29; // End with REPLACE-CSID (RFC 9800 Sec.4.2.1)
  SRV6_LOCAL_ACTION_END_X_REPLACE = 30; // End.X with REPLACE-CSID (RFC 9800 Sec.4.2.2)
  // The Locator-Block Swap behaviors (RFC 9800 Sec.7) are expressed on
  // the wire as their base behavior plus a target-block SID property, so
  // these values never reach the BPF map; the API maps them to the base
  // action with the target block in the aux and reports them back
  // whenever the target block is set. They live at 100+ to stay clear of
  // both the built-in tail-call slots and the plugin action range
  // (32..63), whose numbers share this enum's value space.
  SRV6_LOCAL_ACTION_END_LBS = 100; // End.LBS with NEXT-C-SID (RFC 9800 Sec.7.1.1)
  SRV6_LOCAL_ACTION_END_XLBS = 101; // End.XLBS with NEXT-C-SID (RFC 9800 Sec.7.2.1)
  SRV6_LOCAL_ACTION_END_LBS_REPLACE = 102; // End.LBS with REPLACE-CSID (RFC 9800 Sec.7.1.2)
  SRV6_LOCAL_ACTION_END_XLBS_REPLACE = 103; // End.XLBS with REPLACE-CSID (RFC 9800 Sec.7.2.2)
}

// Srv6ProxyInnerType is the service-programming proxy INNER-TYPE
// (draft-ietf-spring-srv6-service-programming): the one payload type the
// proxy segment carries between the SR domain and the SR-unaware service.
enum Srv6ProxyInnerType {
  SRV6_PROXY_INNER_TYPE_UNSPECIFIED = 0;
  SRV6_PROXY_INNER_TYPE_IPV4 = 1;
  SRV6_PROXY_INNER_TYPE_IPV6 = 2;
  SRV6_PROXY_INNER_TYPE_ETHERNET = 3;
}

// Srv6HeadendBehavior represents SRv6 Headend behavior types
enum Srv6HeadendBehavior {
  SRV6_HEADEND_BEHAVIOR_UNSPECIFIED = 0;
  SRV6_HEADEND_BEHAVIOR_H_INSERT = 1; // H.Insert (Insert SRH after IPv6 header)
  SRV6_HEADEND_BEHAVIOR_H_ENCAPS = 2; // H.Encaps (Encapsulate with outer IPv6+SRH)
  SRV6_HEADEND_BEHAVIOR_H_ENCAPS_L2 = 3; // H.Encaps.L2 (L2 frame encapsulation)
  SRV6_HEADEND_BEHAVIOR_H_M_GTP4_D = 4; // H.M.GTP4.D (GTP-U encapsulation)
  SRV6_HEADEND_BEHAVIOR_H_ENCAPS_RED = 5; // H.Encaps.Red (Reduced SRH encapsulation)
  SRV6_HEADEND_BEHAVIOR_H_ENCAPS_L2_RED = 6; // H.Encaps.L2.Red (Reduced SRH L2 encapsulation)
  SRV6_HEADEND_BEHAVIOR_H_INSERT_RED = 7; // H.Insert.Red (Reduced SRH insertion)
  SRV6_HEADEND_BEHAVIOR_H_M_GTP4_D_TEID = 8; // H.M.GTP4.D with F-TEID lookup (BGP MUP, draft-mpmz-bess-mup-safi)
  SRV6_HEADEND_BEHAVIOR_H_M_GTP6_D = 9; // H.M.GTP6.D (GTP-U/IPv6 => SRv6)
  SRV6_HEADEND_BEHAVIOR_H_M_GTP6_D_TEID = 10; // H.M.GTP6.D with F-TEID lookup (BGP MUP)
}

// OperationError represents an error that occurred during a bulk operation
message OperationError {
  string trigger_prefix = 1; // The trigger prefix that failed
  string reason = 2; // The reason for the failure
}
