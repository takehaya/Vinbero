syntax = "proto3";

package vinbero.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/takehaya/vinbero/api/vinbero/v1;vinberov1";

// PluginService manages dynamic BPF plugin registration into tail call PROG_ARRAY maps.
// Plugins are XDP programs compiled as ELF objects that extend Vinbero's packet processing
// by occupying plugin slots in the endpoint or headend dispatch tables.
service PluginService {
  rpc PluginRegister(PluginRegisterRequest) returns (PluginRegisterResponse);
  rpc PluginUnregister(PluginUnregisterRequest) returns (PluginUnregisterResponse);
  rpc PluginList(PluginListRequest) returns (PluginListResponse);

  // Allocate a fresh aux index, write the given payload, and return the
  // index. Owner tag is derived from (map_type, slot) so later Update /
  // Get / Free calls must come through the same (map_type, slot) pair.
  rpc PluginAuxAlloc(PluginAuxAllocRequest) returns (PluginAuxAllocResponse);
  // Overwrite the payload at an index already owned by (map_type, slot).
  rpc PluginAuxUpdate(PluginAuxUpdateRequest) returns (PluginAuxUpdateResponse);
  // Read the on-wire bytes stored at an index. Caller decodes via its own
  // BTF / Go struct layout; the server returns raw bytes + the owner tag.
  rpc PluginAuxGet(PluginAuxGetRequest) returns (PluginAuxGetResponse);
  // Zero the entry and release the index back to the allocator.
  rpc PluginAuxFree(PluginAuxFreeRequest) returns (PluginAuxFreeResponse);
  // Free every aux index owned by (map_type, slot). Use after
  // PluginUnregister to release indices that were not freed by
  // PluginAuxFree before the slot was retired.
  rpc PluginAuxPurge(PluginAuxPurgeRequest) returns (PluginAuxPurgeResponse);
  // Enumerate aux indices currently owned by the given filter. Empty
  // filter returns all live indices.
  rpc PluginAuxList(PluginAuxListRequest) returns (PluginAuxListResponse);

  // Control-plane plugins are registered separately from data-plane ones.
  // The two halves of a plugin are different artifacts with different
  // lifecycles -- an eBPF object occupies a PROG_ARRAY slot, a WebAssembly
  // module runs in the daemon -- so they get their own calls rather than
  // one overloaded request whose fields are half-ignored either way.
  //
  // Registering a name that is already running replaces it in place: the
  // state the old instance wrote is kept and the new module reconciles
  // over it, so an upgrade does not empty the data plane in between.
  rpc CplanePluginRegister(CplanePluginRegisterRequest) returns (CplanePluginRegisterResponse);
  // Stop a control-plane plugin and remove the state it owns. This is the
  // deliberate removal; a plugin that merely crashes is restarted and
  // keeps its entries.
  rpc CplanePluginUnregister(CplanePluginUnregisterRequest) returns (CplanePluginUnregisterResponse);
  // Enumerate running control-plane plugins.
  rpc CplanePluginList(CplanePluginListRequest) returns (CplanePluginListResponse);
}

message PluginRegisterRequest {
  string map_type = 1; // PROG_ARRAY target: "endpoint", "headend_v4", "headend_v6", "headend_l2"
  uint32 index = 2; // Plugin slot index (endpoint: 32-63, headend: 16-31)
  bytes bpf_elf = 3; // Compiled BPF ELF object file bytes
  string program = 4; // BPF program function name within the ELF (e.g., "plugin_counter")
}

message PluginRegisterResponse {}

message PluginUnregisterRequest {
  string map_type = 1; // PROG_ARRAY target: "endpoint", "headend_v4", "headend_v6", "headend_l2"
  uint32 index = 2; // Plugin slot index to clear
}

message PluginUnregisterResponse {}

message PluginListRequest {
  string map_type_filter = 1; // Empty = all map types; otherwise "endpoint" / "headend_v4" / "headend_v6" / "headend_l2"
}

message PluginInfo {
  string map_type = 1;
  uint32 slot = 2;
  string program = 3;
  bool has_aux_type = 4;
  string aux_type_name = 5;
  repeated string owned_map_names = 6; // Maps the plugin ELF declared that were not replaced by vinbero-shared ones
  repeated string shared_rw_names = 7;
  repeated string shared_ro_names = 8;
  google.protobuf.Timestamp registered_at = 9;
}

message PluginListResponse {
  // Plugins are sorted by (map_type, slot) ascending so callers can rely on
  // stable ordering for diffs and snapshot comparisons.
  repeated PluginInfo plugins = 1;
}

message PluginAuxAllocRequest {
  string map_type = 1;
  uint32 slot = 2;
  oneof payload {
    string json = 3; // Encoded by the server via the plugin's BTF-declared <program>_aux type.
    bytes raw = 4; // Raw bytes, <= SidAuxPluginRawMax (256).
  }
}
message PluginAuxAllocResponse {
  uint32 index = 1;
}

message PluginAuxUpdateRequest {
  uint32 index = 1;
  string map_type = 2;
  uint32 slot = 3;
  oneof payload {
    string json = 4;
    bytes raw = 5;
  }
}
message PluginAuxUpdateResponse {}

message PluginAuxGetRequest {
  uint32 index = 1;
  string map_type = 2;
  uint32 slot = 3;
}
message PluginAuxGetResponse {
  bytes raw = 1; // Exactly SidAuxPluginRawMax bytes.
  string owner = 2; // Owner tag registered at Alloc time.
  bool has_aux_type = 3; // Whether the plugin registered a BTF <program>_aux struct.
}

message PluginAuxFreeRequest {
  uint32 index = 1;
  string map_type = 2;
  uint32 slot = 3;
}
message PluginAuxFreeResponse {}

message PluginAuxPurgeRequest {
  string map_type = 1;
  uint32 slot = 2;
}
message PluginAuxPurgeResponse {
  uint32 purged_count = 1;
}

message PluginAuxListRequest {
  // Filter behaviour:
  //   - both empty: return all live aux indices (builtin + plugin)
  //   - map_type set: restrict to plugin-owned indices for that map type
  //   - map_type + slot + match_slot=true: restrict to that exact slot.
  //     match_slot is required because slot=0 is a valid uint32 zero
  //     value but never a valid plugin slot; without the boolean we
  //     could not distinguish "no slot filter" from "slot 0".
  string map_type = 1;
  uint32 slot = 2;
  // match_slot disambiguates "filter only by map_type" (false) from
  // "filter by both map_type and slot" (true). Plugin slots start at
  // the per-map-type base, so a zero slot with match_slot=true falls
  // outside the valid range and surfaces an empty result -- safer than
  // overloading slot=0 as the wildcard.
  bool match_slot = 3;
}

message AuxIndexInfo {
  uint32 index = 1;
  string owner = 2; // Persisted owner tag (e.g. "plugin:v1:endpoint:32").
}

message PluginAuxListResponse {
  repeated AuxIndexInfo entries = 1;
}

message CplanePluginRegisterRequest {
  // Name identifies the plugin and becomes the owner tag its writes
  // carry, so it must fit the fixed-width owner buffer and hold no colon.
  string name = 1;
  // Wasm is the WebAssembly module.
  bytes wasm = 2;
  // Config is the operator's configuration for this deployment, handed to
  // the module's configure export. It is opaque to the daemon: the plugin
  // defines its own message. Keeping it out of the module means changing
  // a threshold does not mean rebuilding and re-shipping the plugin.
  bytes config = 3;
  // Families restricts which BGP families the plugin is delivered, by the
  // operator-facing name ("vpnv4", "evpn", ...). Empty means every family.
  repeated string families = 4;
  // EndpointBehaviors are the SRv6 endpoint behavior codepoints this
  // plugin claims. Routes naming one are withheld from vinbero's own
  // appliers, which would otherwise read an unrecognized codepoint as an
  // ordinary service SID. Standardized codepoints cannot be claimed.
  repeated uint32 endpoint_behaviors = 5;
  // Capabilities are what this plugin is allowed to do, by name:
  // "headend", "advertise", "local_sid". The daemon links only the host
  // functions they cover, so a capability that was not granted is not a
  // call that fails but a function the module cannot reach. An empty list
  // leaves the plugin able to observe and to log, which is a real way to
  // run one.
  repeated string capabilities = 7;
  // TickIntervalMs asks for the plugin's on_tick export to be called at
  // this rate. Zero leaves it undriven, which is right for a purely
  // event-driven plugin. The daemon clamps it up to its own minimum: a
  // tick is a call into a sandbox under the same budget as an event, so a
  // plugin cannot ask to be woken faster than the daemon will oblige.
  uint32 tick_interval_ms = 6;
}

message CplanePluginRegisterResponse {
  // Replaced is true when this registration upgraded a running plugin of
  // the same name rather than starting a new one.
  bool replaced = 1;
}

message CplanePluginUnregisterRequest {
  string name = 1;
}

message CplanePluginUnregisterResponse {}

message CplanePluginListRequest {}

message CplanePluginInfo {
  string name = 1;
}

message CplanePluginListResponse {
  repeated CplanePluginInfo plugins = 1;
}
