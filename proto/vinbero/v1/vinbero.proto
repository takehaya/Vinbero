syntax = "proto3";

package vinbero.v1;

import "vinbero/v1/enums.proto";
import "vinbero/v1/locator.proto";

option go_package = "github.com/takehaya/vinbero/api/vinbero/v1;vinberov1";

// SidFunctionService manages SRv6 Endpoint functions (End, End.X, End.DT4, End.DT2, etc.).
// Each SID is identified by a trigger_prefix (IPv6 CIDR) and maps to an action
// that determines how matching SRv6 packets are processed.
//
// Depends on: VrfService (vrf_name via VrfCreate, bridge_name via VrfBridgeAttach must exist before use)
service SidFunctionService {
  rpc SidFunctionCreate(SidFunctionCreateRequest) returns (SidFunctionCreateResponse);
  rpc SidFunctionDelete(SidFunctionDeleteRequest) returns (SidFunctionDeleteResponse);
  rpc SidFunctionList(SidFunctionListRequest) returns (SidFunctionListResponse);
  rpc SidFunctionFlush(SidFunctionFlushRequest) returns (SidFunctionFlushResponse);
  rpc SidFunctionGet(SidFunctionGetRequest) returns (SidFunctionGetResponse);
}

// SidFunction represents a single SRv6 Endpoint function configuration.
// The action field determines which optional fields are relevant:
//   - End.DT4/DT6/DT46: vrf_name (VRF-aware FIB lookup)
//   - uT (END_UT): trigger_prefix (/48) + vrf_name (required; shift-and-forward in the VRF table)
//   - End.DT2: bd_id + bridge_name (L2 FDB lookup + bridge flood on miss)
//   - End.DX2: oif (direct L2 output to specific interface)
//   - End.DX2V: table_id (VLAN cross-connect table scope)
//   - End.B6/End.B6.Encaps: segments + headend_mode + src_addr (policy binding)
//   - End/End.X/End.T: basic SRv6 transit, no extra fields needed
message SidFunction {
  Srv6LocalAction action = 1; // Endpoint function type
  string trigger_prefix = 2; // IPv6 CIDR that activates this SID (e.g., "fc00:1::1/128")
  string src_addr = 3; // Source address for encapsulation
  string dst_addr = 4; // Destination address override
  string nexthop = 5; // Next-hop for cross-connect functions (End.X)
  Srv6LocalFlavor flavor = 6; // SRv6 flavor: PSP, USP, USD
  uint32 arg_src_offset = 7; // Bit offset for source in SID Args
  uint32 arg_dst_offset = 8; // Bit offset for destination in SID Args
  uint32 oif = 9; // Output interface index (End.DX2: direct L2 output)
  string vrf_name = 10; // VRF device name, resolved to an ifindex for the FIB lookup (End.T/DT4/DT6/DT46: optional; uT: required)
  uint32 bd_id = 11; // Bridge Domain ID (End.DT2: FDB scope for MAC learning)
  string bridge_name = 12; // Bridge device name (End.DT2: redirect target on FDB miss)
  repeated string segments = 13; // Policy segment list (End.B6/End.B6.Encaps)
  Srv6HeadendBehavior headend_mode = 14; // Policy mode: H_INSERT, H_ENCAPS, etc. (End.B6)
  uint32 args_offset = 15; // Args.Mob.Session byte offset in SID (RFC 9433, for GTP functions)
  string gtp_v4_src_addr = 16; // GTP4 outer IPv4 source address (End.M.GTP4.E)
  uint32 table_id = 17; // VLAN table ID (End.DX2V: VLAN cross-connect scope)
  bytes plugin_aux_raw = 18; // Plugin-defined auxiliary payload (<= 256 bytes, cast by plugin via VINBERO_PLUGIN_AUX_CAST)
  string plugin_aux_json = 19; // Plugin-defined auxiliary payload as JSON; server encodes via plugin BTF. Mutually exclusive with plugin_aux_raw.
  uint32 plugin_aux_index = 20; // Reference an aux index previously returned by PluginAuxAlloc. Mutually exclusive with plugin_aux_raw / plugin_aux_json. Requires action >= EndpointPluginBase.

  // Allocate the SID from a registered locator pool. Mutually exclusive
  // with trigger_prefix: requests that set both fields are rejected with
  // a per-entry error, and requests that set neither are likewise
  // rejected at the SidFunctionCreate boundary. When locator_ref alone
  // is set the server builds the SID from locator.prefix +
  // locator_ref.function and materializes the result back into
  // trigger_prefix, so List / Get see the same /128 prefix regardless of
  // how the entry was originally created.
  optional LocatorRef locator_ref = 21;

  // End.M.GTP4.E: extract the GTP-U outer IPv4 source from the outer IPv6
  // source address at this bit position (0..96, RFC 9433 §6.6) instead of
  // using the static gtp_v4_src_addr. The peer that embeds the source (e.g.
  // a MUP-PE with mup_gtp4_source_prefix) must use the same position (its
  // prefix length). Presence-aware so position 0 stays expressible; exactly
  // one of gtp_v4_src_addr / gtp_v4_src_position must be set for
  // END_M_GTP4_E.
  optional uint32 gtp_v4_src_position = 22;

  // Service programming proxies (End.AS, draft-ietf-spring-srv6-service-programming).
  // The forward direction reuses oif (IFACE-OUT) and, for End.AS, src_addr +
  // segments as the static CACHE the return direction re-encapsulates with.
  // iface_in / vlan_in name the dedicated return circuit; exactly one proxy
  // segment may own a given {iface_in, vlan_in}.
  optional uint32 iface_in = 23; // IFACE-IN ifindex (required for proxy actions)
  optional uint32 vlan_in = 24; // IFACE-IN VLAN (omitted/0 = untagged)
  Srv6ProxyInnerType inner_type = 25; // proxy INNER-TYPE (required for proxy actions)
  // Service MAC (the draft's NH-ADDR) for L3 inner types. When set, the
  // forward path rewrites the Ethernet header statically (source MAC is
  // taken from the IFACE-OUT device); when omitted, the inner destination
  // is resolved through the FIB (route it via IFACE-OUT).
  optional string service_mac = 26;
  // End.AD: tolerated outer hop-limit drift before the dynamic cache is
  // rewritten (0 = any hop-limit change refreshes the cache).
  optional uint32 hop_limit_margin = 27;
  // End.AN: NF-catalog metadata for the SR-aware service behind this SID
  // (up to 63 ASCII characters). SidFunctionList then doubles as the
  // service registration point for NF discovery.
  optional string service_name = 28;
  // uN / uA (NEXT-C-SID, RFC 9800): locator block length in bits. Only
  // the F3216 structure (32) is supported today; omitted defaults to 32.
  // The trigger_prefix must cover exactly block + node for uN (e.g. /48)
  // and block + node + function for uA (e.g. /64); uA reuses nexthop.
  optional uint32 usid_block_len = 29;
}

message SidFunctionCreateRequest {
  repeated SidFunction sid_functions = 1;
}
message SidFunctionCreateResponse {
  repeated SidFunction created = 1;
  repeated OperationError errors = 2; // Per-entry errors; successful entries are in created
}

message SidFunctionDeleteRequest {
  repeated string trigger_prefixes = 1; // IPv6 CIDRs to delete
}
message SidFunctionDeleteResponse {
  repeated string deleted_trigger_prefixes = 1;
  repeated OperationError errors = 2;
}

message SidFunctionListRequest {}
message SidFunctionListResponse {
  repeated SidFunction sid_functions = 1;
}

message SidFunctionGetRequest {
  string trigger_prefix = 1;
}
message SidFunctionGetResponse {
  SidFunction sid_function = 1;
}

message SidFunctionFlushRequest {}
message SidFunctionFlushResponse {
  uint32 deleted_count = 1;
}

// Headendv4Service manages SRv6 Headend behavior for IPv4 packets.
// Matching IPv4 packets are encapsulated with an outer IPv6 header and SRH.
service Headendv4Service {
  rpc Headendv4Create(Headendv4CreateRequest) returns (Headendv4CreateResponse);
  rpc Headendv4Delete(Headendv4DeleteRequest) returns (Headendv4DeleteResponse);
  rpc Headendv4List(Headendv4ListRequest) returns (Headendv4ListResponse);
  rpc Headendv4Flush(Headendv4FlushRequest) returns (Headendv4FlushResponse);
  rpc Headendv4Get(Headendv4GetRequest) returns (Headendv4GetResponse);
}

// Headendv4 represents an IPv4 prefix → SRv6 encapsulation rule.
message Headendv4 {
  Srv6HeadendBehavior mode = 1; // H.Insert or H.Encaps
  string trigger_prefix = 2; // IPv4 CIDR (e.g., "10.0.0.0/24")
  string src_addr = 3; // Outer IPv6 source address
  string dst_addr = 4; // Outer IPv6 destination (optional, usually derived from segments)
  repeated string segments = 5; // SRv6 segment list
  uint32 args_offset = 6; // Args.Mob.Session byte offset in SID (RFC 9433, for H.M.GTP4.D)
}

message Headendv4CreateRequest {
  repeated Headendv4 headendv4s = 1;
}
message Headendv4CreateResponse {
  repeated Headendv4 created = 1;
  repeated OperationError errors = 2;
}

message Headendv4DeleteRequest {
  repeated string trigger_prefixes = 1;
}
message Headendv4DeleteResponse {
  repeated string deleted_trigger_prefixes = 1;
  repeated OperationError errors = 2;
}

message Headendv4ListRequest {}
message Headendv4ListResponse {
  repeated Headendv4 headendv4s = 1;
}

message Headendv4GetRequest {
  string trigger_prefix = 1;
}
message Headendv4GetResponse {
  Headendv4 headendv4 = 1;
}

message Headendv4FlushRequest {}
message Headendv4FlushResponse {
  uint32 deleted_count = 1;
}

// Headendv6Service manages SRv6 Headend behavior for IPv6 packets.
service Headendv6Service {
  rpc Headendv6Create(Headendv6CreateRequest) returns (Headendv6CreateResponse);
  rpc Headendv6Delete(Headendv6DeleteRequest) returns (Headendv6DeleteResponse);
  rpc Headendv6List(Headendv6ListRequest) returns (Headendv6ListResponse);
  rpc Headendv6Get(Headendv6GetRequest) returns (Headendv6GetResponse);
  rpc Headendv6Flush(Headendv6FlushRequest) returns (Headendv6FlushResponse);
}

// Headendv6 represents an IPv6 prefix → SRv6 encapsulation rule.
message Headendv6 {
  Srv6HeadendBehavior mode = 1;
  string trigger_prefix = 2; // IPv6 CIDR (e.g., "2001:db8::/32")
  string src_addr = 3;
  string dst_addr = 4;
  repeated string segments = 5;
  uint32 args_offset = 6; // Args.Mob.Session byte offset in SID (RFC 9433, for H.M.GTP6.D)
}

message Headendv6CreateRequest {
  repeated Headendv6 headendv6s = 1;
}
message Headendv6CreateResponse {
  repeated Headendv6 created = 1;
  repeated OperationError errors = 2;
}

message Headendv6DeleteRequest {
  repeated string trigger_prefixes = 1;
}
message Headendv6DeleteResponse {
  repeated string deleted_trigger_prefixes = 1;
  repeated OperationError errors = 2;
}

message Headendv6ListRequest {}
message Headendv6ListResponse {
  repeated Headendv6 headendv6s = 1;
}

message Headendv6GetRequest {
  string trigger_prefix = 1;
}
message Headendv6GetResponse {
  Headendv6 headendv6 = 1;
}

message Headendv6FlushRequest {}
message Headendv6FlushResponse {
  uint32 deleted_count = 1;
}

// DmacService provides read-only access to the FDB (MAC address table).
// FdbService manages the FDB (forwarding database) for L2VPN MAC forwarding.
// Dynamic entries are learned by the BPF data plane; static entries are
// user-configured and never aged out.
service FdbService {
  rpc FdbList(FdbListRequest) returns (FdbListResponse);
  rpc FdbCreate(FdbCreateRequest) returns (FdbCreateResponse);
  rpc FdbDelete(FdbDeleteRequest) returns (FdbDeleteResponse);
  rpc FdbFlush(FdbFlushRequest) returns (FdbFlushResponse);
}

// FdbEntry represents a single FDB entry with aging and type information.
message FdbEntry {
  uint32 bd_id = 1; // Bridge Domain ID that scopes this MAC entry
  string mac = 2; // MAC address (e.g., "aa:bb:cc:dd:ee:ff")
  uint32 oif = 3; // Output interface index (for local entries)
  bool is_untag = 4; // Reserved for future VLAN tag stripping on egress
  bool is_remote = 5; // true if learned via SRv6 End.DT2 (remote PE)
  bool is_static = 6; // true if user-configured (never aged out)
  uint64 last_seen = 7; // bpf_ktime_get_ns() timestamp (0 for static entries)
  string esi = 8; // Remote only: RFC 7432 ESI (e.g., "00:11:22:33:44:55:66:77:88:99"), empty=single-homing
}

message FdbListRequest {}
message FdbListResponse {
  repeated FdbEntry entries = 1;
}

message FdbCreateRequest {
  uint32 bd_id = 1;
  string mac = 2; // MAC address (e.g., "aa:bb:cc:dd:ee:ff")
  uint32 oif = 3; // Output interface index
}
message FdbCreateResponse {}

message FdbDeleteRequest {
  uint32 bd_id = 1;
  string mac = 2;
}
message FdbDeleteResponse {}

message FdbFlushRequest {
  uint32 bd_id = 1; // 0 = flush all BDs; otherwise only entries in this BD
  bool keep_static = 2; // if true, only learned/remote entries are removed
}
message FdbFlushResponse {
  uint32 deleted_count = 1;
}

// VlanTableService manages VLAN cross-connect table entries for End.DX2V.
// Each entry maps (table_id, vlan_id) to an output interface for VLAN-based
// P2P cross-connect (EVPN Flexible Cross-connect).
service VlanTableService {
  rpc VlanTableCreate(VlanTableCreateRequest) returns (VlanTableCreateResponse);
  rpc VlanTableDelete(VlanTableDeleteRequest) returns (VlanTableDeleteResponse);
  rpc VlanTableList(VlanTableListRequest) returns (VlanTableListResponse);
  rpc VlanTableFlush(VlanTableFlushRequest) returns (VlanTableFlushResponse);
}

message VlanTableEntry {
  uint32 table_id = 1; // VLAN table scope (shared across SIDs)
  uint32 vlan_id = 2; // VLAN ID (0-4095)
  string interface_name = 3; // Output interface name (resolved to ifindex by server)
}

message VlanTableCreateRequest {
  repeated VlanTableEntry entries = 1;
}
message VlanTableCreateResponse {
  repeated VlanTableEntry created = 1;
  repeated OperationError errors = 2;
}

message VlanTableDeleteRequest {
  repeated VlanTableEntry entries = 1; // Identifies by (table_id, vlan_id)
}
message VlanTableDeleteResponse {
  repeated VlanTableEntry deleted = 1;
  repeated OperationError errors = 2;
}

message VlanTableListRequest {
  uint32 table_id = 1; // Filter by table_id; 0 returns all entries
}
message VlanTableListResponse {
  repeated VlanTableEntry entries = 1;
}

message VlanTableFlushRequest {
  uint32 table_id = 1; // 0 = flush all tables; otherwise only entries in this table
}
message VlanTableFlushResponse {
  uint32 deleted_count = 1;
}

// BdPeerService manages remote PEs within a Bridge Domain for BUM traffic flooding.
// When a BUM frame (broadcast/unknown-unicast/multicast) is detected, Vinbero
// sends SRv6-encapsulated copies to all registered peers in the same BD.
//
// Depends on: HeadendL2Service (bd_id must match an existing HeadendL2 entry)
service BdPeerService {
  rpc BdPeerCreate(BdPeerCreateRequest) returns (BdPeerCreateResponse);
  rpc BdPeerDelete(BdPeerDeleteRequest) returns (BdPeerDeleteResponse);
  rpc BdPeerList(BdPeerListRequest) returns (BdPeerListResponse);
  rpc BdPeerFlush(BdPeerFlushRequest) returns (BdPeerFlushResponse);
}

// BdPeer represents a remote PE that participates in a Bridge Domain.
// Each peer has a segment list describing the SRv6 path to reach it.
message BdPeer {
  uint32 bd_id = 1; // Bridge Domain ID this peer belongs to
  string src_addr = 2; // Outer IPv6 source address for SRv6 encap
  repeated string segments = 3; // Segment list to reach this PE
  Srv6HeadendBehavior mode = 4; // Headend mode (default: H_ENCAPS_L2, or H_ENCAPS_L2_RED for Reduced SRH)
  string esi = 5; // RFC 7432 Ethernet Segment Identifier this peer attaches to (empty=single-homing)
}

message BdPeerCreateRequest {
  repeated BdPeer peers = 1;
}
message BdPeerCreateResponse {
  repeated BdPeer created = 1;
  repeated OperationError errors = 2;
}

message BdPeerDeleteRequest {
  repeated uint32 bd_ids = 1; // Delete all peers for these BD IDs
}
message BdPeerDeleteResponse {
  repeated uint32 deleted_bd_ids = 1;
  repeated OperationError errors = 2;
}

message BdPeerListRequest {
  uint32 bd_id = 1; // Filter by BD ID; 0 returns all peers
}
message BdPeerListResponse {
  repeated BdPeer peers = 1;
}

message BdPeerFlushRequest {
  uint32 bd_id = 1; // 0 = flush all BDs; otherwise only peers in this BD
}
message BdPeerFlushResponse {
  uint32 deleted_count = 1;
}

// EthernetSegmentService manages RFC 7432 Ethernet Segment Identifiers (ESIs)
// used for EVPN multi-homing: CRUD plus static Designated Forwarder (DF)
// election via EsSetDf / EsClearDf.
service EthernetSegmentService {
  rpc EsCreate(EsCreateRequest) returns (EsCreateResponse);
  rpc EsDelete(EsDeleteRequest) returns (EsDeleteResponse);
  rpc EsList(EsListRequest) returns (EsListResponse);
  rpc EsSetDf(EsSetDfRequest) returns (EsSetDfResponse);
  rpc EsClearDf(EsClearDfRequest) returns (EsClearDfResponse);
}

// EsiRedundancyMode reflects RFC 7432 multi-homing modes.
enum EsiRedundancyMode {
  ESI_REDUNDANCY_MODE_UNSPECIFIED = 0;
  ESI_REDUNDANCY_MODE_SINGLE_HOMING = 1;
  ESI_REDUNDANCY_MODE_ALL_ACTIVE = 2;
  ESI_REDUNDANCY_MODE_SINGLE_ACTIVE = 3;
}

// EthernetSegment represents a single ES entry stored in the ESI master table.
message EthernetSegment {
  string esi = 1; // 10-byte RFC 7432 ESI as colon-separated hex
  bool local_attached = 2; // true if this PE attaches to the ES
  // local_pe_src_addr is the IPv6 source this PE uses in H.Encaps.L2 for this
  // ES. Required when local_attached=true so DF judgement can compare against
  // df_pe_src_addr. Ignored otherwise.
  string local_pe_src_addr = 3;
  // df_pe_src_addr names the current Designated Forwarder for this ES. Empty
  // means "no DF configured yet" (all attached PEs forward BUM, DF=implicit).
  string df_pe_src_addr = 4;
  EsiRedundancyMode redundancy_mode = 5;
  // rd is the route distinguisher for this Ethernet Segment's RT4 (Ethernet
  // Segment route). When set together with local_attached=true and EVPN
  // auto-advertise on, the daemon originates the RT4 automatically (the
  // ES-Import route target is derived from the ESI). Empty disables RT4
  // auto-advertise for this ES.
  string rd = 6;
}

message EsCreateRequest {
  repeated EthernetSegment entries = 1;
}
message EsCreateResponse {
  repeated EthernetSegment created = 1;
  repeated OperationError errors = 2;
}

message EsDeleteRequest {
  repeated string esis = 1; // ESI strings to delete
}
message EsDeleteResponse {
  repeated string deleted = 1;
  repeated OperationError errors = 2;
}

message EsListRequest {}
message EsListResponse {
  repeated EthernetSegment entries = 1;
}

message EsSetDfRequest {
  string esi = 1;
  string df_pe_src_addr = 2; // IPv6 of the PE promoted to DF
}
message EsSetDfResponse {
  EthernetSegment updated = 1;
}

message EsClearDfRequest {
  string esi = 1;
}
message EsClearDfResponse {
  EthernetSegment updated = 1;
}

// Vrf is the VRF object: one identity carrying every facet. The kernel-device
// facet (table_id, members, enable_l3mdev_rule, ifindex) is the Linux VRF
// device End.DT4/DT6/DT46 use for VRF-aware FIB lookup. The ingress facet
// (vrf_id, acs) classifies packets at the XDP entry: vrf_id is the data-plane
// id (0 = global/default VRF, the underlay) and acs is the ingress
// {interface, VLAN} membership. The L2 facet (bridge) is the bridge domain
// End.DT2/DT2M deliver into. A VRF may carry any subset of facets — a MUP
// gateway has an ingress-only VRF with no kernel device, an L2-only EVI has
// just a bridge. All facets are managed by VrfService.
message Vrf {
  string name = 1; // VRF name (e.g., "vrf100")
  uint32 table_id = 2; // Linux routing table ID (kernel-device facet)
  repeated string members = 3; // Interfaces to enslave to this VRF (kernel-device facet)
  bool enable_l3mdev_rule = 4; // Add "ip rule add l3mdev" if not already present
  uint32 vrf_id = 5; // ingress/data-plane id, server-assigned (0 = global/default VRF)
  repeated VrfAc acs = 6; // ingress access-circuit membership
  uint32 ifindex = 7; // kernel VRF device ifindex, server-assigned (0 = deviceless)
  Bridge bridge = 8; // L2 bridge-domain facet; unset = none
}

message VrfCreateRequest {
  repeated Vrf vrfs = 1; // kernel-device facet only (name + table_id + members + l3mdev); acs / vrf_id / ifindex / bridge must be unset
}
message VrfCreateResponse {
  repeated Vrf created = 1; // server state after the create (carries vrf_id and ifindex)
  repeated OperationError errors = 2;
}

message VrfDeleteRequest {
  repeated string names = 1; // VRF names to delete; fails while a SID, ingress AC, vrf-bgp binding or attached bridge references the VRF
}
message VrfDeleteResponse {
  repeated string deleted_names = 1;
  repeated OperationError errors = 2;
}

// Bridge is the VRF's L2 bridge-domain facet: the Linux bridge End.DT2
// delivers into (FDB miss flooding) and FDBWatcher learns MACs from, plus the
// bd_id that scopes the FDB and EVPN advertisements. Attached via
// VrfBridgeAttach; the device name may differ from the VRF name.
message Bridge {
  string name = 1; // Bridge device name (e.g., "br100")
  uint32 bd_id = 2; // Bridge Domain ID (1..65535) for FDB scoping and FDBWatcher registration
  repeated string members = 3; // Interfaces to enslave to this bridge
  uint32 ifindex = 4; // bridge device ifindex, server-assigned; must be unset on requests
}

// VrfBridgeAttachRequest attaches the L2 facet: it creates (or adopts) the
// kernel bridge and records it on the VRF. A VRF carries at most one bridge,
// and a bridge / bd_id belongs to exactly one VRF.
message VrfBridgeAttachRequest {
  string vrf_name = 1;
  Bridge bridge = 2; // bridge.ifindex must be unset (server-assigned)
}
message VrfBridgeAttachResponse {
  Vrf vrf = 1; // the VRF after the attach
}

message VrfBridgeDetachRequest {
  // Deletes the kernel bridge. Fails while an operator-created SID references
  // the bridge; the End.DT2U/DT2M SIDs the EVPN auto-advertise exporter
  // installed for this bd are excluded from that check — the detach itself
  // tears them down (route withdraw + SID removal) after the bridge delete.
  string vrf_name = 1;
}
message VrfBridgeDetachResponse {}

// HeadendL2Service manages L2 frame SRv6 encapsulation (H.Encaps.L2).
// Frames arriving on a specific interface+VLAN are encapsulated with SRv6 headers.
//
// Depends on: VrfService (the bridge must be attached via VrfBridgeAttach if bd_id > 0)
service HeadendL2Service {
  rpc HeadendL2Create(HeadendL2CreateRequest) returns (HeadendL2CreateResponse);
  rpc HeadendL2Delete(HeadendL2DeleteRequest) returns (HeadendL2DeleteResponse);
  rpc HeadendL2List(HeadendL2ListRequest) returns (HeadendL2ListResponse);
  rpc HeadendL2Get(HeadendL2GetRequest) returns (HeadendL2GetResponse);
  rpc HeadendL2Flush(HeadendL2FlushRequest) returns (HeadendL2FlushResponse);
}

// HeadendL2 represents a port+VLAN → SRv6 L2 encapsulation rule.
// When bd_id is 0, all frames are encapsulated directly (P2P mode, no MAC learning).
// When bd_id > 0, MAC learning and FDB-based forwarding are enabled (P2MP mode).
message HeadendL2 {
  uint32 vlan_id = 1; // VLAN ID to match (0 for untagged traffic)
  string src_addr = 2; // Outer IPv6 source address for SRv6 encap
  repeated string segments = 3; // SRv6 segment list
  uint32 bd_id = 4; // Bridge Domain ID; 0 = direct encap (no BD), >0 = MAC learning enabled
  string interface_name = 5; // Customer-facing interface name (resolved to ifindex internally)
  Srv6HeadendBehavior mode = 6; // Headend mode (default: H_ENCAPS_L2, or H_ENCAPS_L2_RED for Reduced SRH)
  string esi = 7; // RFC 7432 Ethernet Segment Identifier of the local AC (empty=single-homing)
}

message HeadendL2CreateRequest {
  repeated HeadendL2 headend_l2s = 1;
}
message HeadendL2CreateResponse {
  repeated HeadendL2 created = 1;
  repeated OperationError errors = 2;
}

message HeadendL2DeleteTarget {
  string interface_name = 1;
  uint32 vlan_id = 2;
}
message HeadendL2DeleteRequest {
  repeated HeadendL2DeleteTarget targets = 1;
}
message HeadendL2DeleteResponse {
  repeated HeadendL2DeleteTarget deleted = 1;
  repeated OperationError errors = 2;
}

message HeadendL2ListRequest {}
message HeadendL2ListResponse {
  repeated HeadendL2 headend_l2s = 1;
}

message HeadendL2GetRequest {
  string interface_name = 1;
  uint32 vlan_id = 2;
}
message HeadendL2GetResponse {
  HeadendL2 headend_l2 = 1;
}

message HeadendL2FlushRequest {}
message HeadendL2FlushResponse {
  uint32 deleted_count = 1;
}

// StatsService provides read-only access to per-CPU XDP packet statistics.
// Requires enable_stats: true in config; otherwise all counters are zero.
service StatsService {
  rpc StatsShow(StatsShowRequest) returns (StatsShowResponse);
  rpc StatsReset(StatsResetRequest) returns (StatsResetResponse);
  rpc StatsSlotShow(StatsSlotShowRequest) returns (StatsSlotShowResponse);
  rpc StatsSlotReset(StatsSlotResetRequest) returns (StatsSlotResetResponse);
}

message StatsCounter {
  string name = 1;
  uint64 packets = 2;
  uint64 bytes = 3;
}

message StatsShowRequest {}
message StatsShowResponse {
  repeated StatsCounter counters = 1;
}

message StatsResetRequest {}
message StatsResetResponse {}

// Per-slot invocation counter entry (one per PROG_ARRAY slot).
// name: human-readable label (built-in enum name, or "plugin:<program>", or empty for reserved).
message SlotStatsEntry {
  string map_type = 1; // "endpoint" | "headend_v4" | "headend_v6"
  uint32 slot = 2; // 0-63 (endpoint) / 0-31 (headend)
  string name = 3;
  uint64 packets = 4;
  uint64 bytes = 5;
}

message StatsSlotShowRequest {
  repeated string map_types = 1; // empty = all three types
  bool include_empty = 2; // include packets==0 slots (default: hide)
}
message StatsSlotShowResponse {
  repeated SlotStatsEntry entries = 1;
}

message StatsSlotResetRequest {
  repeated string map_types = 1; // empty = reset all three types
}
message StatsSlotResetResponse {}

// HeadendGroupService exposes the ECMP path groups the headend resolves
// through. It is read-only: groups are written by the BGP receive path as
// routes arrive, so there is no operator-facing create. Reading them is what
// answers "is this prefix actually load-balancing, and over what".
service HeadendGroupService {
  rpc HeadendGroupList(HeadendGroupListRequest) returns (HeadendGroupListResponse);
  rpc HeadendGroupGet(HeadendGroupGetRequest) returns (HeadendGroupGetResponse);
}

// One member of a group: the encapsulation a flow selecting this path takes.
message HeadendGroupMember {
  uint32 index = 1; // position in the group; the liveness bit that covers it
  repeated string segments = 2; // the SRv6 segment list this path encapsulates to
  uint32 weight = 3; // relative share; equal weights mean an equal split
  uint32 policy_id = 4; // SR Policy this member composes onto, 0 = none
  // live reflects ecmp_live_map. It is true when no prober has reported on
  // the group, since a group with no liveness information is used in full
  // rather than treated as entirely down.
  bool live = 5;
}

message HeadendGroup {
  uint32 group_id = 1;
  // prefixes are the trigger entries pointing at this group. Normally one,
  // but the group table does not itself record which prefix it serves, so
  // this is derived by scanning the headend maps and can legitimately be
  // empty for a group whose trigger has not been written yet.
  repeated string prefixes = 2;
  repeated HeadendGroupMember members = 3;
  string owner = 4;
  // live_bitmap is the raw ecmp_live_map value; live_known is false when the
  // group has no entry, meaning every path is treated as up.
  uint64 live_bitmap = 5;
  bool live_known = 6;
}

message HeadendGroupListRequest {}
message HeadendGroupListResponse {
  repeated HeadendGroup groups = 1;
}

message HeadendGroupGetRequest {
  uint32 group_id = 1;
}
message HeadendGroupGetResponse {
  HeadendGroup group = 1;
}

// VrfService is the single VRF surface, managing every facet of the VRF
// object. The kernel-device facet (VrfCreate/VrfDelete): a Linux VRF device
// persisted to the JSON state file and reconciled on startup. The L2 facet
// (VrfBridgeAttach/VrfBridgeDetach): the bridge domain End.DT2/DT2M deliver
// into, same persistence; attach also registers the bridge with FDBWatcher
// for MAC learning. The ingress facet (VrfAcAdd/VrfAcRemove/VrfSetPolicy):
// access-circuit membership ({interface, VLAN}) and the global default-deny
// policy. A VRF's vrf_id is allocated on first reference; the data plane
// resolves a packet's VRF once at the XDP entry from its {ifindex, VLAN}.
// VrfShow returns all facets.
service VrfService {
  rpc VrfCreate(VrfCreateRequest) returns (VrfCreateResponse); // create (or adopt) the kernel VRF device
  rpc VrfDelete(VrfDeleteRequest) returns (VrfDeleteResponse); // delete the whole VRF; refuses while referenced
  rpc VrfBridgeAttach(VrfBridgeAttachRequest) returns (VrfBridgeAttachResponse); // create (or adopt) the bridge, attach the L2 facet
  rpc VrfBridgeDetach(VrfBridgeDetachRequest) returns (VrfBridgeDetachResponse); // delete the bridge; refuses while a SID references it (EVPN exporter-owned SIDs excluded)
  rpc VrfAcAdd(VrfAcAddRequest) returns (VrfAcAddResponse); // add an AC (creates the VRF)
  rpc VrfAcRemove(VrfAcRemoveRequest) returns (VrfAcRemoveResponse);
  rpc VrfSetPolicy(VrfSetPolicyRequest) returns (VrfSetPolicyResponse);
  rpc VrfShow(VrfShowRequest) returns (VrfShowResponse);
}

// VrfAc is an ingress access circuit ({interface, VLAN}) that belongs to a VRF.
// It is the VRF's ingress membership: the data plane resolves a packet's VRF
// once at the XDP entry from its {ifindex, VLAN}.
message VrfAc {
  string interface_name = 1; // ingress port (resolved to ifindex by server)
  uint32 vlan = 2; // VLAN ID (0 = untagged)
}

// VrfPolicy is the global ingress policy. default_deny drops (or passes, per
// deny_action) a packet whose AC is unmapped instead of falling into the
// global/default VRF (vrf_id 0).
message VrfPolicy {
  bool default_deny = 1;
  string deny_action = 2; // "drop" (default) | "pass"
}

// VrfAcAddRequest / VrfAcRemoveRequest manage a VRF's ingress membership.
// Adding an AC creates the VRF (allocating its vrf_id) if absent; a VRF needs
// no Linux device (a MUP gateway classifies ingress without one).
message VrfAcAddRequest {
  string name = 1; // VRF name
  VrfAc ac = 2;
}
message VrfAcAddResponse {
  Vrf vrf = 1; // the VRF after the add (carries the assigned vrf_id)
}
message VrfAcRemoveRequest {
  string name = 1;
  VrfAc ac = 2;
}
message VrfAcRemoveResponse {}

message VrfSetPolicyRequest {
  VrfPolicy policy = 1;
}
message VrfSetPolicyResponse {
  VrfPolicy policy = 1;
}

message VrfShowRequest {}
message VrfShowResponse {
  repeated Vrf vrfs = 1; // both facets (kernel device + ingress membership)
  VrfPolicy policy = 2;
}
