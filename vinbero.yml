internal:
  devices:
    - eth1
    - eth2
  bpf:
    device_mode: "driver"
    verifier_log_level: 2
    verifier_log_size: 1073741823
  server:
    bind: "0.0.0.0:8080"
  logger:
    level: info      # debug, info, warn, error
    format: text     # text, json
    no_color: false
    add_caller: false

settings:
  # Runtime options for BPF program
  enable_stats: false   # Enable packet statistics collection
  fdb_aging_seconds: 300  # FDB entry aging timeout in seconds (0=disabled)
  entries:
    sid_function:
      capacity: 1024
    headendv4:
      capacity: 1024
    headendv6:
      capacity: 1024
    headend_l2:
      capacity: 1024
    fdb:
      capacity: 8192
    bd_peer:
      capacity: 1024
    sr_policy:
      capacity: 1024
    service_ingress:
      capacity: 1024

