internal:
  devices:
    - eth1
    - eth2
  bpf:
    device_mode: "driver"
  server:
    bind: "0.0.0.0:8080"
  logger:
    level: info      # debug, info, warn, error
    format: text     # text, json
    no_color: false
    add_caller: false

settings:
  # Runtime options for BPF program
  enable_stats: false   # Enable packet statistics collection
  fdb_aging_seconds: 300  # FDB entry aging timeout in seconds (0=disabled)
  entries:
    sid_function:
      capacity: 1024
    headendv4:
      capacity: 1024
    headendv6:
      capacity: 1024
    headend_l2:
      capacity: 1024
    fdb:
      capacity: 8192
    bd_peer:
      capacity: 1024
    sr_policy:
      capacity: 1024
    service_ingress:
      capacity: 1024
  # L2VPN BUM replication (docs/design/ja/bum_mode.md). "tc" (default)
  # clones in TC and floods locally through the kernel bridge; "xdp"
  # replicates through a per-BD devmap and keeps the bridge off the path
  # (no STP / IGMP snooping / bridge netfilter). xdp runs with
  # internal.bpf.device_mode generic or driver.
  # l2:
  #   bum_mode: tc
  #   bridge_domains:
  #     - bd_id: 100
  #       bum_mode: xdp

# In-process BGP speaker. Only consulted when vinberod runs with
# --bgp-enabled; otherwise this whole section is ignored.
# bgp:
#   global:
#     local_asn: 65000
#     router_id: "10.0.0.1"
#     listen_port: -1          # -1 = do not bind TCP/179 (coexist with host BGP)
#     source_locator: "LOC1"   # locator supplying the SRv6 encap source (Phase 1d+)
#   peers:
#     - neighbor: "10.0.0.2"
#       peer_asn: 65000
#       hold_time_sec: 90
#       keepalive_sec: 30
#       families:
#         - vpnv4
#         - vpnv6
#         - ipv6_unicast
#         - sr_policy_ipv6
#       # Negotiate ADD-PATH receive (RFC 7911) so this neighbor may send
#       # several paths for one prefix. Set it on a route reflector session:
#       # a reflector sends only its best path per prefix by default, which
#       # hides the other PEs' paths. An iBGP full mesh does not need it.
#       add_paths_receive: false
